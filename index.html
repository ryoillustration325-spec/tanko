<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>photo retouch</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D0F11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="photo retouch">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* 写真編集アプリとして、暗い面で統一（写真の色を正しく見るため。Lightroomと同じ考え方） */
  /* レイアウト：上＝操作バー／中央＝写真／下＝選んだ機能のパネル／最下段＝5つのアイコン。広い画面は右に操作列 */
  :root{
    --bg:#0D0F11; --surface:#16191C; --surface2:#1E2226; --ink:#E6EBEF; --muted:#9AA6AF; --faint:#6C7880;
    --accent:#8FB0C4; --warm:#E0A36B; --line:#2A3036; --line-soft:#22272C; --warn:#E0A36B;
    --shadow:0 12px 32px -16px rgba(0,0,0,.8);
    --f-ui:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans",system-ui,sans-serif; --f-num:"Inter",-apple-system,system-ui,sans-serif;
    --tabh:58px; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%; background:var(--bg); overflow:hidden}
  body{background:var(--bg); color:var(--ink); font-family:var(--f-ui); -webkit-font-smoothing:antialiased; line-height:1.55;
    -webkit-tap-highlight-color:transparent; overflow:hidden; overscroll-behavior:none}
  .num{font-family:var(--f-num); font-variant-numeric:tabular-nums}
  input[type=file]{display:none; color-scheme:dark}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .app{position:fixed; top:0; right:0; bottom:0; left:0; height:auto; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto auto;
    grid-template-areas:"top" "stage" "sheet" "tabs";
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
  .topbar{grid-area:top; min-width:0; position:relative; z-index:7; background:var(--bg); display:flex; align-items:center; gap:8px; padding:8px 12px; min-height:52px}
  .tb{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500; padding:8px 13px; border-radius:18px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; -webkit-user-select:none; user-select:none; white-space:nowrap}
  .tb.pri{background:var(--accent); color:#0E1418; border-color:transparent; font-weight:600}
  .tb:disabled{opacity:.4; cursor:default}
  #cmp{touch-action:none}
  .tbmid{flex:1; display:flex; justify-content:center; gap:6px}
  .ib{width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); cursor:pointer; padding:0}
  .ib:disabled{opacity:.3; cursor:default}
  .ib svg,.tab svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}

  .stagewrap{grid-area:stage; min-height:0; position:relative; padding:0 8px 8px}
  #stage{touch-action:none}
  #view{will-change:transform}
  .stage{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:10px; background:#08090A}
  .stage canvas{display:block; max-width:100%; max-height:100%; width:auto; height:auto}
  /* 写真の選択：写真を置く場所のどこを押しても選択（透明な入力欄を全面に重ね、指で直接押す形。プログラムから押すと白いちらつきが出るため使わない）。
     iPhoneの選択メニューは押した指の位置に出る（iOSの仕様） */
  .drop{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; width:100%; height:100%; padding:24px; -webkit-user-select:none; user-select:none}
  .dropbtn{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-width:min(280px,84%); min-height:170px; padding:28px 32px 24px; border-radius:22px;
    background:rgba(255,255,255,.03); border:1px dashed rgba(255,255,255,.14); transition:background-color .15s, border-color .15s}
  .drop{position:relative}
  .drop > input[type=file]{display:block; position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:16px; z-index:2; color-scheme:dark}
  .app:not(.collapsed) .drop{padding-bottom:calc(min(32dvh,270px) + 8px)}  /* 下のパネルに隠れない位置で中央に */
  @media (min-width:900px), (min-width:600px) and (orientation:landscape){ .app:not(.collapsed) .drop{padding-bottom:24px} }
  .dropbtn.press{background:var(--surface); border-color:var(--accent)}
  @media (hover:hover){ .dropbtn:hover{background:var(--surface); border-color:var(--line)} }
  .drop .big{font-size:16px; font-weight:500}
  .drop .sub{font-size:12px; color:var(--faint)}
  .drop .mark{width:64px; height:64px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--accent); margin-bottom:6px}
  .drop .mark svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.6}
  body.dragging .stage{outline:2px dashed var(--accent); outline-offset:-8px}
  .chip{position:absolute; top:10px; background:rgba(13,15,17,.72); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:4px 10px; font-size:11px; color:#E6EBEF; display:none}
  .chip.left{left:10px}
  .chip .warn{color:#F0B47E}
  .busy{position:absolute; left:50%; top:10px; transform:translateX(-50%); white-space:nowrap; font-size:11px; color:#E6EBEF; background:rgba(13,15,17,.78);
    border-radius:14px; padding:4px 10px; display:none}
  #size{display:none !important}

  /* パネルは写真の上に半透明で重ねる（写真の大きさは常に同じ。Lightroomと同じ） */
  .sheet{grid-area:stage; align-self:end; z-index:5; min-height:0; min-width:0; height:min(32vh, 270px); height:min(32dvh, 270px); touch-action:pan-y; display:flex; flex-direction:column;
    margin:0 8px; border-radius:16px 16px 0 0; background:rgba(16,18,21,.72); -webkit-backdrop-filter:blur(16px) saturate(1.1); backdrop-filter:blur(16px) saturate(1.1);
    border:1px solid rgba(255,255,255,.06); border-bottom:0; transition:transform .22s ease, opacity .22s ease, height .22s ease, background-color .22s ease}
  .app.expanded .sheet{height:100%; background:rgba(16,18,21,.9)}
  .app.collapsed .sheet{transform:translateY(calc(100% - 40px)); opacity:.94}
  .sheet.dragging{transition:none}
  .grab{flex:none; height:30px; display:flex; align-items:center; justify-content:center; cursor:grab; border:0; background:transparent; width:100%; padding:0; touch-action:none}
  .grab::before{content:""; width:44px; height:5px; border-radius:3px; background:rgba(255,255,255,.32)}
  /* 写真だけを見る：上下の操作部分を隠す（場所は空けたままなので写真の大きさは変わらない） */
  .topbar,.tabbar{transition:opacity .22s ease}
  .app.immersive .topbar,.app.immersive .tabbar{opacity:0; pointer-events:none}
  .app.immersive .sheet{transform:translateY(105%) !important; opacity:0; pointer-events:none}
  .app.immersive .chip{opacity:0}
  .app.collapsed .grab::before{background:rgba(255,255,255,.5)}
  .sheet .row input[type=range]{background:rgba(255,255,255,.18)}
  .sheet .group.off .gbody{opacity:.5}
  .subtabs{display:flex; gap:6px; overflow-x:auto; padding:2px 12px 4px; scrollbar-width:none; flex:none}
  .subtabs::-webkit-scrollbar{display:none}
  .subtabs:empty{display:none}
  .stab{flex:none; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:7px 12px; border-radius:16px; border:1px solid rgba(255,255,255,.12);
    background:rgba(0,0,0,.18); color:var(--muted); cursor:pointer; white-space:nowrap}
  .stab.on{background:var(--surface2); color:var(--ink); border-color:var(--accent)}
  .stab i,.tab i{width:6px; height:6px; border-radius:50%; background:var(--warm); display:none}
  .stab.act i,.tab.act i{display:block}
  .panel{flex:1; min-height:0; min-width:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 12px 30px}
  .tabbar{grid-area:tabs; min-width:0; position:relative; z-index:7; display:grid; grid-template-columns:repeat(6,1fr); border-top:1px solid var(--line-soft); background:var(--bg);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab{position:relative; height:var(--tabh); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:0; background:transparent;
    color:var(--faint); font-size:10.5px; cursor:pointer}
  .tab.on{color:var(--ink)}
  .tab.on svg{stroke:var(--accent)}
  .tab i{position:absolute; top:9px; right:calc(50% - 16px)}
  .toast{position:fixed; left:50%; top:calc(64px + env(safe-area-inset-top,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg);
    padding:9px 16px; border-radius:20px; font-size:12.5px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; max-width:90vw; text-align:center}
  .toast.show{opacity:1}
  /* パネルの中のグループ（カードではなく、区切り線で並べる） */
  .panel .group{background:transparent; border:0; border-radius:0; margin:0; border-bottom:1px solid var(--line-soft)}
  .panel .group:last-child{border-bottom:0}
  .panel .ghead{padding:10px 2px 6px; cursor:default}
  .panel .caret{display:none}
  .panel .gbody{display:block; padding:0 2px 10px}
  .panel .row label{width:96px}
  /* 仕上げ：見本付きプリセット */
  .looks{max-width:100%; min-width:0; display:flex; gap:10px; overflow-x:auto; padding:6px 2px 10px; scrollbar-width:none}
  .looks::-webkit-scrollbar{display:none}
  .pchip{flex:none; width:76px; display:flex; flex-direction:column; align-items:center; gap:5px; border:0; background:transparent; color:var(--muted); font-size:11px; cursor:pointer; padding:0}
  .pchip canvas,.pchip .ph{width:76px; height:96px; border-radius:8px; display:block; background:var(--surface2); border:2px solid transparent; object-fit:cover}
  .pchip.on{color:var(--ink); font-weight:600}
  .pchip.on canvas,.pchip.on .ph{border-color:var(--accent)}
  .pchip .nm{max-width:76px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pchip.mine .nm::before{content:"★ "; color:var(--warm)}
  .pchip.legacyt .ph{display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); border:1px dashed var(--line, #8884)}
  .pchip.old .nm{opacity:.75}
  .autobox{margin:2px 0 12px; padding:10px 12px 8px; border:1px solid var(--line); border-radius:12px; background:var(--surface2)}
  .autobox[hidden]{display:none}
  .autohead{font-size:12.5px; font-weight:600; color:var(--accent); letter-spacing:.02em; margin-bottom:2px}
  .autobox .row label{width:72px}
  .autoseg{margin:6px 0 4px}
  .autoseg[hidden]{display:none}
  .l5seg{flex-wrap:wrap}
  .l5seg[hidden]{display:none}
  .l5oldh{font-size:11px; color:var(--muted); margin:8px 2px 0}
  .l5oldh[hidden]{display:none}
  .l6box[hidden]{display:none}
  .l6own{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0}
  .l6thumb{width:44px; height:44px; object-fit:cover; border-radius:6px}
  .l6sl{margin:8px 2px 4px}
  .l6slh{display:flex; justify-content:space-between; font-size:11px; color:var(--muted)}
  .l6slv{font-variant-numeric:tabular-nums; color:var(--ink)}
  .l6sl input[type=range]{width:100%; margin:6px 0 2px; touch-action:pan-y}
  .l6sle{display:flex; justify-content:space-between; font-size:10px; color:var(--faint)}
  .l6skin{margin:4px 0 6px}
  .l6cands{display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin:4px 0 6px}
  .l6cand{padding:0; border:2px solid transparent; border-radius:9px; overflow:hidden; background:var(--surface2); cursor:pointer; display:flex; flex-direction:column; align-items:stretch; font:inherit; color:var(--muted)}
  .l6cand.on{border-color:var(--accent)}
  .l6cand img{width:100%; height:92px; object-fit:cover; display:block}
  .l6cl{font-size:10px; padding:3px 4px 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left}
  .l6skin .hint{margin:4px 2px}
  .l6sw{display:inline-block; width:20px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
  .seg.l5seg button.l6chip{display:inline-flex; align-items:center; justify-content:center}
  .seg.l6list{align-content:flex-start; overflow:hidden; touch-action:pan-y}
  .seg.l6list button.l6chip{flex:0 0 auto; min-width:58px; padding:6px 8px; font-variant-numeric:tabular-nums}
  .l6mood{flex:0 0 100%; box-sizing:border-box; min-width:0; font-size:11px; color:var(--muted); padding:6px 4px 0}
  .l6mood:first-child{padding-top:2px}
  .seg.l5seg button{flex:1 0 auto; white-space:nowrap; font-size:12px; padding:7px 10px}
  .autobox .rbtn{width:100%; margin-top:4px}
  .autolearn{display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--faint); border-top:1px solid var(--line-soft); padding-top:6px; margin-top:2px}
  .linkbtn{background:none; border:0; color:var(--muted); font-size:11px; text-decoration:underline; padding:4px 0; cursor:pointer}
  .linkbtn[hidden]{display:none}
  .prefinfo{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--faint); margin:6px 0 2px}
  .prefinfo b{color:var(--muted); font-weight:600; font-family:"Inter",sans-serif}
  .prefinfo[hidden]{display:none}
  .prefmodal{position:fixed; inset:0; z-index:80; background:rgba(8,10,12,.92); display:flex; align-items:center; justify-content:center; padding:max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom))}
  .prefmodal[hidden]{display:none}
  .prefbox{width:100%; max-width:720px; max-height:100%; overflow:auto; display:flex; flex-direction:column; gap:10px}
  .prefhead{font-size:13px; color:var(--ink); text-align:center; letter-spacing:.02em}
  .prefgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; align-items:center}
  .prefcell{padding:0; border:2px solid transparent; border-radius:10px; overflow:hidden; background:var(--surface); cursor:pointer; line-height:0}
  .prefcell:active, .prefcell:hover{border-color:var(--accent)}
  .prefcell canvas{width:100%; height:auto; max-height:34vh; object-fit:contain; display:block}
  .rbtn.resetall{width:100%; margin:0 0 8px; font-size:12px; color:var(--muted)}
  .lookrow{display:flex; gap:8px; align-items:center}
  .lookrow .rbtn{flex:1}
  .aibtn{background:linear-gradient(180deg, rgba(143,176,196,.16), rgba(143,176,196,.06)); border-color:rgba(143,176,196,.45) !important}

  /* 広い画面（PC・タブレット・スマホ横向き）：左に写真、右に操作列 */
  @media (min-width:900px), (min-width:600px) and (orientation:landscape){
    .app{grid-template-columns:minmax(0,1fr) clamp(320px,32vw,400px); grid-template-rows:auto auto minmax(0,1fr);
      grid-template-areas:"top top" "stage tabs" "stage sheet"}
    .stagewrap{padding:0 0 12px 12px}
    .tabbar{border-top:0; border-bottom:1px solid var(--line-soft); padding-bottom:0}
    .sheet{grid-area:sheet; align-self:stretch; height:auto; margin:0; border-radius:0; border:0; background:var(--bg); -webkit-backdrop-filter:none; backdrop-filter:none; transform:none !important; opacity:1 !important}
    .grab{display:none}
    .app.immersive .sheet{transform:none !important}
    .app.expanded .sheet{height:auto}
    .toast{top:auto; bottom:24px}
  }
  .sect{font-size:11px; letter-spacing:.18em; color:var(--faint); margin:18px 2px 2px; font-family:"Inter",sans-serif}
  .group{background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-top:8px; overflow:hidden}
  .ghead{display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer}
  .ghead .t{flex:1; font-size:13.5px; font-weight:500}
  .ghead .t small{display:block; color:var(--faint); font-weight:400; font-size:11px; margin-top:1px}
  .caret{color:var(--faint); font-size:11px; transition:transform .15s}
  .group.open .caret{transform:rotate(90deg)}
  .tg{width:40px; height:24px; border-radius:12px; background:var(--line); position:relative; flex:none; border:0; padding:0; cursor:pointer}
  .tg::after{content:""; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .15s}
  .tg.on{background:var(--accent)}
  .tg.on::after{left:18px}
  .gbody{padding:0 14px 12px; display:none}
  .group.open .gbody{display:block}
  .group.off .gbody{opacity:.45}
  .row{display:flex; align-items:center; gap:12px; padding:7px 0}
  .row label{font-size:12px; color:var(--muted); width:84px; flex:none}
  .row input[type=range]{flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; background:var(--line); outline:none}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--accent); cursor:pointer; border:3px solid var(--surface)}
  .row input[type=range]::-moz-range-thumb{width:18px; height:18px; border-radius:50%; background:var(--accent); cursor:pointer; border:3px solid var(--surface)}
  .row .val{font-family:"Inter",sans-serif; font-size:12px; width:34px; text-align:right}
  .seg{display:flex; gap:4px; padding:4px; margin:4px 0 8px; background:var(--surface2); border:1px solid var(--line-soft); border-radius:10px}
  .seg button{flex:1; font:inherit; font-size:12px; padding:8px 4px; border:0; border-radius:7px; background:transparent; color:var(--muted); cursor:pointer}
  .seg button.on{background:var(--accent); color:#0f1418; font-weight:600}
  /* 追加機能 */
  #gde{position:absolute; pointer-events:none; margin:0 !important; max-width:none !important; max-height:none !important}
  body.picking #view{touch-action:none; cursor:crosshair}
  .thumbrow{display:flex; gap:12px; align-items:flex-start; margin:6px 0 4px}
  .thumb{width:56px; height:56px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); flex:none}
  .tcol{flex:1; min-width:0}
  .tinput{flex:1.6; min-width:0; font:inherit; font-size:13px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface2); color:var(--ink); margin:4px 0 6px}
  .mplist{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 6px}
  .mpchip{display:flex; align-items:center; border:1px solid var(--line); border-radius:16px; background:var(--surface2); overflow:hidden}
  .mpchip button{font:inherit; border:0; background:transparent; color:var(--ink); cursor:pointer}
  .mpname{font-size:12.5px; padding:7px 4px 7px 12px}
  .mpdel{font-size:13px; padding:7px 11px 7px 8px; color:var(--faint) !important}
  .ftable{margin:6px 0 8px; font-size:12px}
  .mtable{margin:2px 0 8px; font-size:12px}
  .mtr{display:grid; grid-template-columns:5.5em 1fr 1fr 6em; gap:8px; padding:6px 2px; border-bottom:1px solid var(--line-soft); align-items:center}
  .mtr span:nth-child(2),.mtr span:nth-child(3){text-align:right}
  .mtr span:last-child{text-align:right}
  .mth{color:var(--faint); font-size:11px; letter-spacing:.06em}
  .mtr .ok{color:var(--accent); font-weight:600}
  .mtr .ng{color:var(--warn); font-weight:600}
  .ftr{display:grid; grid-template-columns:4.5em 1fr 4.5em; gap:8px; padding:6px 2px; border-bottom:1px solid var(--line-soft); align-items:center}
  .fth{color:var(--faint); font-size:11px; letter-spacing:.06em}
  .ftr .ok{color:var(--accent); font-weight:600}
  .ftr .ng{color:var(--warn); font-weight:600}
  .fmodal{position:fixed; inset:0; z-index:20; background:rgba(8,10,12,.72); display:flex; justify-content:center; align-items:flex-start; overflow:auto;
    padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
  .fmodal[hidden]{display:none !important}
  .fpane{width:min(440px,100%); background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow)}
  .fhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  .ftitle{font-size:15px; font-weight:600}
  .fclose{font:inherit; font-size:12.5px; padding:8px 14px; border-radius:16px; border:1px solid var(--line); background:var(--surface2); color:var(--ink); cursor:pointer}
  .fgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; background:var(--bg)}
  .ftile{width:100%; height:auto; aspect-ratio:3/4; display:block}
  .ftile.me{outline:2px solid var(--warn); outline-offset:-2px}
  /* 部分調整 */
  #ovl{position:absolute; pointer-events:none; margin:0 !important; max-width:none !important; max-height:none !important}
  #bcur{position:absolute; pointer-events:none; border:1.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.5); border-radius:50%; display:none; transform:translate(-50%,-50%)}
  body.brushing #view{touch-action:none; cursor:crosshair}
  .rbtn{width:100%; font:inherit; font-size:13px; font-weight:600; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--surface2); color:var(--ink); cursor:pointer; margin:4px 0 6px}
  .rbtn.ghost{font-weight:500; font-size:12px; padding:9px; color:var(--muted)}
  .rbtn:disabled{opacity:.45; cursor:default}
  .rrow{display:flex; gap:6px}
  .rrow .rbtn{flex:1}
  .rstat{font-size:11.5px; color:var(--muted); min-height:18px; margin:2px 0 6px}
  .rchips{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 8px}
  .rchip{display:flex; align-items:center; gap:6px; font:inherit; font-size:12px; padding:7px 11px; border-radius:16px; background:var(--surface2); border:1px solid var(--line); color:var(--muted); cursor:pointer}
  .rchip i{width:10px; height:10px; border-radius:50%; display:block}
  .rchip.on{border-color:var(--accent); color:var(--ink); font-weight:600; box-shadow:inset 0 0 0 1px var(--accent)}
  .rsub{font-size:11px; letter-spacing:.12em; color:var(--faint); margin:12px 0 2px; font-family:"Inter",sans-serif}
  .rline{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12px; color:var(--muted)}
  .rline .sp{flex:1}
  .regwrap.dis .rneed{opacity:.4; pointer-events:none}
  /* 元画像を見ている間：表示を消す（ボタン自体は押したまま反応させるため pointer-events は残す） */
  .app.peek .tabbar,.app.peek .sheet,.app.peek .chip,.app.peek .topbar > *:not(#cmp){opacity:0}
  .app.peek #cmp{opacity:.35}
  .app.peek .sheet{pointer-events:none}
  /* 調整中：動かしている項目だけ残して、ほかは消す（写真全体が見える） */
  .app.sliding .topbar,.app.sliding .tabbar,.app.sliding .chip{opacity:0; pointer-events:none}
  .app.sliding .sheet{background:transparent !important; border-color:transparent; -webkit-backdrop-filter:none; backdrop-filter:none}
  .app.sliding .sheet *{visibility:hidden}
  .app.sliding .sheet .keep,.app.sliding .sheet .keep *{visibility:visible}
  .app.sliding .keep{background:rgba(13,15,17,.62); box-shadow:0 0 0 8px rgba(13,15,17,.62); border-radius:10px; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
  /* カラーグレーディング（写真の下のパネルに収まる大きさ） */
  .cgsel{display:flex; align-items:center; justify-content:center; gap:12px; margin:0 0 8px}
  .cgb{position:relative; width:34px; height:34px; border-radius:50%; border:0; background:transparent; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .cgb .cgdot{width:22px; height:22px; border-radius:50%; display:block; border:1.5px solid rgba(255,255,255,.35)}
  .cgb-s .cgdot{background:#15181b} .cgb-m .cgdot{background:#6d747a} .cgb-h .cgdot{background:#e9edf0} .cgb-g .cgdot{background:linear-gradient(90deg,#15181b 50%,#e9edf0 50%)}
  .cgb .cgx{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:12px; padding:3px 8px; white-space:nowrap}
  .cgb.on .cgdot{outline:2px solid var(--accent); outline-offset:3px}
  .cgb.on .cgx{color:var(--ink); border-color:var(--accent)}
  .cgb-x{width:auto; margin-left:6px}
  .cgb.used::after{content:""; position:absolute; bottom:-5px; left:50%; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--warm)}
  .cgname{display:none}
  /* パネルが小さい時は見出しを省いて、ホイールを写真の下に収める */
  .app:not(.expanded) .panel #g-cg .ghead{display:none}
  .app:not(.expanded) .panel #g-cg .hint{display:none}
  .cgsel .cgnm{font-size:11px; color:var(--faint); letter-spacing:.06em; min-width:5.5em; text-align:right; white-space:nowrap}
  .cgmain{display:flex; gap:14px; align-items:center}
  .cgwheel{position:relative; flex:none; width:min(142px,38vw); aspect-ratio:1; touch-action:none; cursor:crosshair}
  .cgwheel canvas{width:100%; height:100%; display:block; border-radius:50%}
  .cgmk{position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; border:2.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.4); pointer-events:none}
  .cgcol{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px}
  .cgtop{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted)}
  .cgrow input[type=range]{width:100%; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; background:rgba(255,255,255,.18); outline:none; margin:6px 0 4px}
  .cgrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--accent); border:3px solid var(--surface)}
  .cgrow input.huetrack{height:6px; background:linear-gradient(90deg,hsl(0,75%,55%),hsl(60,75%,55%),hsl(120,75%,55%),hsl(180,75%,55%),hsl(240,75%,55%),hsl(300,75%,55%),hsl(360,75%,55%))}
  .app.sliding .cgwrap.keep{box-shadow:0 0 0 8px rgba(13,15,17,.62)}
  /* トリミング */
  .cropui{position:absolute; inset:0; display:none; z-index:3; touch-action:none; cursor:move}
  .cimg{position:absolute; pointer-events:none}
  .cbox{position:absolute; border:1.5px solid rgba(255,255,255,.95); box-shadow:0 0 0 9999px rgba(8,9,10,.62); pointer-events:auto; touch-action:none; cursor:move}
  .cbox .th,.cbox .tv{position:absolute; background:rgba(255,255,255,.35); pointer-events:none}
  .cbox .th{left:0; right:0; height:1px} .cbox .th1{top:33.33%} .cbox .th2{top:66.66%}
  .cbox .tv{top:0; bottom:0; width:1px} .cbox .tv1{left:33.33%} .cbox .tv2{left:66.66%}
  /* 辺（上下左右）：辺全体が触れる。見た目は中央の短い線 */
  .ced{position:absolute; touch-action:none; z-index:1}
  .ced-t,.ced-b{left:22px; right:22px; height:30px; cursor:ns-resize} .ced-t{top:-15px} .ced-b{bottom:-15px}
  .ced-l,.ced-r{top:22px; bottom:22px; width:30px; cursor:ew-resize} .ced-l{left:-15px} .ced-r{right:-15px}
  .ced::after{content:""; position:absolute; background:#fff; border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,.35)}
  .ced-t::after,.ced-b::after{left:50%; top:50%; width:26px; height:4px; margin:-2px 0 0 -13px}
  .ced-l::after,.ced-r::after{left:50%; top:50%; width:4px; height:26px; margin:-13px 0 0 -2px}
  /* 角：大きめの当たり判定 */
  .chd{position:absolute; width:40px; height:40px; touch-action:none; z-index:2}
  .chd::after{content:""; position:absolute; width:16px; height:16px; border:3px solid #fff; pointer-events:none}
  .chd-tl{left:-20px; top:-20px; cursor:nwse-resize} .chd-tl::after{left:18px; top:18px; border-right:0; border-bottom:0}
  .chd-tr{right:-20px; top:-20px; cursor:nesw-resize} .chd-tr::after{right:18px; top:18px; border-left:0; border-bottom:0}
  .chd-bl{left:-20px; bottom:-20px; cursor:nesw-resize} .chd-bl::after{left:18px; bottom:18px; border-right:0; border-top:0}
  .chd-br{right:-20px; bottom:-20px; cursor:nwse-resize} .chd-br::after{right:18px; bottom:18px; border-left:0; border-top:0}
  /* トリミング中は、写真全体が下のパネルに隠れない大きさで表示 */
  .app.cropping:not(.collapsed):not(.expanded) .stage{padding-bottom:calc(min(32dvh,270px) + 6px); box-sizing:border-box}
  @media (min-width:900px), (min-width:600px) and (orientation:landscape){ .app.cropping .stage{padding-bottom:0 !important} }
  /* トリミングの指の受け口は、調整中の「残す部分」の見た目（ぼかし・影）を付けない＝写真がぼけない */
  .app.sliding .cropui.keep{background:none !important; box-shadow:none !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important}
  .stage canvas#view{transform-origin:center center}
  /* トリミング操作中：写真の外の暗い部分を少し薄くして、全体が見えるように */
  .app.sliding .cbox{box-shadow:0 0 0 9999px rgba(8,9,10,.45)}
  .geofin{margin-bottom:6px}
  .rbtn.pri{background:var(--accent); color:#0E1418; border-color:transparent}
  .cropdone{position:absolute; top:10px; right:10px; z-index:4; display:none; font:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:18px; border:0; background:var(--accent); color:#0E1418; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .app.cropping .cropdone{display:block}
  .app.sliding .cropdone{opacity:0}
  .asprow{display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none}
  .asprow::-webkit-scrollbar{display:none}
  .aspbtn{flex:none; font:inherit; font-size:12px; padding:7px 11px; border-radius:14px; border:1px solid var(--line); background:rgba(0,0,0,.18); color:var(--muted); cursor:pointer}
  .aspbtn.on{border-color:var(--accent); color:var(--ink); background:var(--surface2)}
  .geoinfo{display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 10px; font-size:11.5px; color:var(--faint); margin:4px 0 2px}
  .geoinfo .ok{color:var(--accent); font-weight:600} .geoinfo .ng{color:var(--warn); font-weight:600}
  /* 書き出し画面（フチ・共有） */
  .xmodal{position:fixed; inset:0; z-index:25; background:var(--bg); display:flex; flex-direction:column; padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
  .xmodal[hidden]{display:none !important}
  .xhead{flex:none; display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line-soft)}
  .xtitle{font-size:15px; font-weight:600}
  .xclose{width:40px; height:40px; border:0; background:transparent; color:var(--ink); font-size:20px; cursor:pointer}
  .xshare{width:46px; height:46px; border-radius:50%; border:0; background:var(--accent); color:#0E1418; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:.4; transition:opacity .2s}
  .xmodal.ready .xshare{opacity:1}
  .xshare svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .xprev{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:14px 16px 6px}
  .xprev canvas{max-width:100%; max-height:calc(100% - 28px); display:block; box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .xstat{display:flex; flex-wrap:wrap; justify-content:center; gap:4px 12px; font-size:11.5px; color:var(--faint); min-height:16px}
  .xstat .ok{color:var(--accent); font-weight:600} .xstat .ng{color:var(--warn); font-weight:600}
  .xbody{flex:none; max-height:48vh; overflow-y:auto; padding:0 16px 14px}
  .xsec{border-top:1px solid var(--line-soft); padding:10px 0 6px}
  .xlab{font-size:12px; color:var(--muted); margin-bottom:8px}
  .xsw{display:flex; gap:10px; align-items:center; overflow-x:auto; padding:2px 2px 4px; scrollbar-width:none}
  .xsw::-webkit-scrollbar{display:none}
  .xcol{flex:none; width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.18); cursor:pointer; padding:0}
  .xcol.on{outline:2.5px solid var(--ink); outline-offset:3px}
  .xpick{flex:none; width:40px; height:40px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer}
  .xpick.on{border-color:var(--accent); color:var(--accent)}
  .xpick svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round}
  .xsec .row label{display:none}
  .xratio{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 4px; scrollbar-width:none}
  .xratio::-webkit-scrollbar{display:none}
  .xrb{flex:none; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:50px; border:0; background:transparent; color:var(--muted); font-size:11.5px; cursor:pointer; padding:4px 2px}
  .xri{display:block; border:1.5px solid var(--faint); border-radius:3px; position:relative}
  .xri.ig::after{content:""; position:absolute; left:50%; top:50%; width:9px; height:9px; margin:-5px 0 0 -5px; border:1.5px solid var(--faint); border-radius:3px}
  .xrb.on{color:var(--accent)} .xrb.on .xri,.xrb.on .xri.ig::after{border-color:var(--accent)}
  /* 前後比較（分割） */
  .splitui{position:absolute; display:none; z-index:3; pointer-events:none}
  .splitui .sline{position:absolute; top:0; bottom:0; width:36px; margin-left:-18px; pointer-events:auto; touch-action:none; cursor:ew-resize}
  .splitui .sline::before{content:""; position:absolute; left:17px; top:0; bottom:0; width:2px; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.35)}
  .splitui .sknob{position:absolute; left:50%; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.45)}
  .splitui .sknob::after{content:"◀ ▶"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#333; letter-spacing:-1px}
  .splitui .slab{position:absolute; bottom:8px; font-size:11px; color:#fff; background:rgba(0,0,0,.45); padding:2px 8px; border-radius:10px}
  .splitui .sl-l{left:8px} .splitui .sl-r{right:8px}
  .tb.on{border-color:var(--accent); color:var(--accent)}
  .app.sliding .splitui,.app.peek .splitui{opacity:0}
  /* ヒストグラム（左上の明るさの表示をタップ） */
  .histo{position:absolute; left:10px; top:44px; z-index:4; width:min(260px,70%); background:rgba(13,15,17,.82); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:8px}
  .histo[hidden]{display:none}
  .histo canvas{display:block; width:100%; height:70px}
  .histo .hrow{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:6px; font-size:10.5px; color:var(--faint); white-space:nowrap}
  .histo .warn{color:var(--warn); font-weight:600}
  .histo .hclip{font:inherit; font-size:10.5px; padding:4px 8px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer}
  .histo .hclip.on{border-color:var(--accent); color:var(--accent)}
  .app.sliding .histo,.app.peek .histo{opacity:0}
  /* マスク */
  .lmui{position:absolute; display:none; z-index:3; touch-action:none; overflow:visible}
  .lmov{position:absolute; display:none; z-index:2; pointer-events:none; image-rendering:auto}

  .lmui ellipse.lline{fill:rgba(255,255,255,.001); pointer-events:all}
  .lmui .ldash{fill:none; stroke:rgba(255,255,255,.8); stroke-width:1.2; stroke-dasharray:5 5; pointer-events:none}
  .lmui .lhd{fill:#fff; stroke:rgba(0,0,0,.4); stroke-width:1; cursor:grab}
  .lmui .lend{fill:var(--accent)}
  .lmui .lpin{fill:rgba(255,255,255,.5); stroke:#fff; stroke-width:1.5}
  .lmlist{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 6px}
  .lmlist:empty{display:none}
  .app.sliding .lmui.keep{background:none !important; box-shadow:none !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important}
  /* 編集履歴 */
  .histlist{display:flex; flex-direction:column; gap:2px; margin:2px 0 6px; max-height:46vh; overflow-y:auto}
  .hrowb{display:flex; align-items:center; gap:10px; font:inherit; font-size:12.5px; text-align:left; padding:9px 10px; border-radius:10px; border:1px solid transparent; background:transparent; color:var(--muted); cursor:pointer}
  .hrowb .hnum{width:2.2em; color:var(--faint); font-size:11px; text-align:right}
  .hrowb.on{border-color:var(--accent); color:var(--ink); background:var(--surface2)}
  .hrowb.fut{opacity:.45}

  .pastechip{position:absolute; left:50%; bottom:14px; transform:translate(-50%, 20px); z-index:4; opacity:0; pointer-events:none; font:inherit; font-size:13px; font-weight:600; padding:10px 16px; border-radius:20px; border:0; background:var(--accent); color:#0E1418; box-shadow:0 6px 20px rgba(0,0,0,.45); transition:opacity .2s, transform .2s}
  .pastechip.show{opacity:1; pointer-events:auto; transform:translate(-50%, 0)}
  .app:not(.collapsed):not(.expanded) .pastechip{bottom:calc(min(32dvh,270px) + 14px)}
  .row.sub2 label{padding-left:10px; color:var(--faint)}
  .rstat.okc{color:var(--accent)}
  /* トーンカーブ */
  .crvbox{margin:4px 0 8px}
  .crv{display:block; width:100%; height:180px; touch-action:none; border-radius:10px; background:rgba(0,0,0,.22); border:1px solid var(--line-soft); cursor:crosshair}
  .app.expanded .crv{height:min(48vh,340px)}
  @media (min-width:900px), (min-width:600px) and (orientation:landscape){ .crv{height:240px} }
  /* カラーミキサー：色の見本 */
  .mixrow label{display:flex; align-items:center; gap:8px}
  .mixrow label::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--sw); flex:none}
  .hint{font-size:11px; color:var(--faint); margin-top:2px; line-height:1.55}

<body>
<input type="file" id="file" accept="image/*">
<div class="app" id="app">
  <header class="topbar">
    <label class="tb" for="file" id="change">写真を選ぶ</label>
    <div class="tbmid">
      <button class="ib" id="undo" type="button" aria-label="取り消し" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="ib" id="redo" type="button" aria-label="やり直し" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <button class="tb" id="cmp" type="button" disabled>元画像</button>
    <button class="tb pri" id="save" type="button" disabled>書き出し</button>
  </header>
  <main class="stagewrap"><div class="stage" id="stage">
    <div class="drop" id="drop">
      <input type="file" id="dropfile" accept="image/*" aria-label="写真を選ぶ">
      <div class="dropbtn" id="dropbtn">
        <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span>
        <span class="big" id="dropBig">写真をタップして選択</span>
      </div>
      <span class="sub">JPG / PNG / HEIC ・ 写真は端末の中だけで処理されます ・ <span class="num">v94</span></span>
    </div>
    <canvas id="view" style="display:none"></canvas>
    <canvas id="ovl" style="display:none"></canvas>
    <div id="bcur"></div>
    <canvas id="gde" style="display:none"></canvas>
    <div class="chip left num" id="badge"></div>
    <div class="busy" id="busy">処理中…</div>
  </div></main>
  <section class="sheet" id="sheet" aria-label="編集パネル">
    <button class="grab" id="grab" type="button" aria-label="パネルを隠す／出す"></button>
    <div class="subtabs" id="subtabs" role="tablist"></div>
    <div class="panel" id="panel"></div>
  </section>
  <nav class="tabbar" id="tabbar" aria-label="編集メニュー"></nav>
</div>
<div id="pool" hidden><div id="groups"></div><div id="presets" class="looks"></div><button id="reset" class="rbtn ghost" type="button">すべて初期値に戻す</button><div id="size"></div></div>
<div class="toast" id="toast" role="status"></div>
<script id="tkcore">
// CORE-BEGIN
// 淡光 下ごしらえ — 処理コア（DOM非依存・純関数）
// 入力: RGBA Uint8ClampedArray, 幅, 高さ, パラメータ / 出力: RGBA Uint8ClampedArray
// ぼかしは自前実装（Safariで canvas filter が効かない問題を回避）

function tkClamp01(x){ return x < 0 ? 0 : (x > 1 ? 1 : x); }

// 3回のボックスぼかしでガウスぼかしを近似するためのボックス半径
function tkBoxRadius(sigma){
  var b = Math.round((Math.sqrt(4 * sigma * sigma + 1) - 1) / 2);
  return b < 1 ? 1 : b;
}

function tkBoxH(src, dst, w, h, r){
  var inv = 1 / (2 * r + 1);
  for (var y = 0; y < h; y++){
    var row = y * w * 4;
    for (var c = 0; c < 4; c++){
      var acc = 0, k, xx;
      for (k = -r; k <= r; k++){ xx = k < 0 ? 0 : (k >= w ? w - 1 : k); acc += src[row + xx * 4 + c]; }
      for (var x = 0; x < w; x++){
        dst[row + x * 4 + c] = acc * inv;
        var xo = x - r; if (xo < 0) xo = 0;
        var xi = x + r + 1; if (xi >= w) xi = w - 1;
        acc += src[row + xi * 4 + c] - src[row + xo * 4 + c];
      }
    }
  }
}

// 縦方向は「全列ぶんの累積を1行ずつ進める」方式（メモリを順番に読むので速い）
function tkBoxV(src, dst, w, h, r){
  var inv = 1 / (2 * r + 1), rw = w * 4;
  var acc = new Float32Array(rw), k, yy, j;
  for (k = -r; k <= r; k++){
    yy = k < 0 ? 0 : (k >= h ? h - 1 : k);
    var off = yy * rw;
    for (j = 0; j < rw; j++) acc[j] += src[off + j];
  }
  for (var y = 0; y < h; y++){
    var o = y * rw;
    for (j = 0; j < rw; j++) dst[o + j] = acc[j] * inv;
    var yo = y - r; if (yo < 0) yo = 0;
    var yi = y + r + 1; if (yi >= h) yi = h - 1;
    var oi = yi * rw, oo = yo * rw;
    for (j = 0; j < rw; j++) acc[j] += src[oi + j] - src[oo + j];
  }
}

// 乗算済みRGBA(Float32)をぼかす。大きい半径は縮小してからぼかす（速度対策）
function tkBlur(src, w, h, sigma){
  var f = Math.max(1, Math.floor(sigma / 3));
  var w2 = Math.max(1, Math.ceil(w / f)), h2 = Math.max(1, Math.ceil(h / f));
  var a = new Float32Array(w2 * h2 * 4);
  if (f === 1){
    a.set(src);
  } else {
    var cnt = new Float32Array(w2 * h2);
    for (var y = 0; y < h; y++){
      var yy = (y / f) | 0;
      for (var x = 0; x < w; x++){
        var xx = (x / f) | 0, i = (y * w + x) * 4, j = (yy * w2 + xx) * 4;
        a[j] += src[i]; a[j + 1] += src[i + 1]; a[j + 2] += src[i + 2]; a[j + 3] += src[i + 3];
        cnt[yy * w2 + xx]++;
      }
    }
    for (var k = 0; k < w2 * h2; k++){
      var cc = cnt[k] || 1;
      a[k * 4] /= cc; a[k * 4 + 1] /= cc; a[k * 4 + 2] /= cc; a[k * 4 + 3] /= cc;
    }
  }
  var r = tkBoxRadius(sigma / f);
  var tmp = new Float32Array(a.length);
  for (var p = 0; p < 3; p++){ tkBoxH(a, tmp, w2, h2, r); tkBoxV(tmp, a, w2, h2, r); }
  return { d: a, w: w2, h: h2, f: f };
}

// ぼかし結果を元解像度の「1行ぶん」ずつバイリニア補間で取り出すリーダー
function tkRowReader(B, W){
  var f = B.f, w = B.w, h = B.h, d = B.d;
  var row = new Float32Array(W * 4);
  var xa = new Int32Array(W), xb = new Int32Array(W), xt = new Float32Array(W);
  for (var x = 0; x < W; x++){
    var fx = (x + 0.5) / f - 0.5; if (fx < 0) fx = 0;
    var x0 = fx | 0; if (x0 > w - 1) x0 = w - 1;
    xa[x] = x0 * 4; xb[x] = (x0 + 1 < w ? x0 + 1 : w - 1) * 4; xt[x] = fx - x0;
  }
  return function(y){
    if (f === 1){
      var o = y * w * 4;
      for (var j = 0; j < W * 4; j++) row[j] = d[o + j];
      return row;
    }
    var fy = (y + 0.5) / f - 0.5; if (fy < 0) fy = 0;
    var y0 = fy | 0; if (y0 > h - 1) y0 = h - 1;
    var y1 = y0 + 1 < h ? y0 + 1 : h - 1, ty = fy - y0;
    var r0 = y0 * w * 4, r1 = y1 * w * 4;
    for (var x2 = 0; x2 < W; x2++){
      var a = r0 + xa[x2], b = r0 + xb[x2], c = r1 + xa[x2], e = r1 + xb[x2], tx = xt[x2], p = x2 * 4;
      for (var ch = 0; ch < 4; ch++){
        var top = d[a + ch] + (d[b + ch] - d[a + ch]) * tx;
        var bot = d[c + ch] + (d[e + ch] - d[c + ch]) * tx;
        row[p + ch] = top + (bot - top) * ty;
      }
    }
    return row;
  };
}

function tkLuma(r, g, b){ return 0.2126 * r + 0.7152 * g + 0.0722 * b; }

// 再現性のある乱数（粒子がスライダー操作のたびにチラつかないように）
function tkRng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 縮小グリッド（ぼかし前提のデータは最初から縮小して持つ＝速度とメモリ対策）
function tkGrid(W, H, fs){
  fs = Math.max(1, fs | 0);
  var w2 = Math.ceil(W / fs), h2 = Math.ceil(H / fs);
  return { w: w2, h: h2, f: fs, d: new Float32Array(w2 * h2 * 4), cnt: new Float32Array(w2 * h2) };
}
function tkGridAdd(G, x, y, a, b, c, d){
  var k = ((y / G.f) | 0) * G.w + ((x / G.f) | 0), j = k * 4;
  G.d[j] += a; G.d[j + 1] += b; G.d[j + 2] += c; G.d[j + 3] += d; G.cnt[k]++;
}
function tkGridDone(G){
  for (var k = 0; k < G.w * G.h; k++){
    var c = G.cnt[k] || 1, j = k * 4;
    G.d[j] /= c; G.d[j + 1] /= c; G.d[j + 2] /= c; G.d[j + 3] /= c;
  }
  G.cnt = null;
  return G;
}
function tkBlurGrid(G, sigmaFull){
  var B = tkBlur(G.d, G.w, G.h, Math.max(0.6, sigmaFull / G.f));
  B.f *= G.f;
  return B;
}
function tkSS(t){ t = tkClamp01(t); return t * t * (3 - 2 * t); }

// P（パラメータ）: 0–100のスライダー値そのまま。on.* でグループのON/OFF
// 仕上げの強さを「光」と「色」で別々に：該当する項目の量だけを割合で弱める
var TK_MIXL = ['diff','glow','hal','mist','comp','rAmt','lCa','lSoft','lVeil','lVig'];
var TK_MIXC = ['lift','roll','con','sat','shb','hiw','dens','grain','skAmt','gAtemp','gBtemp','gAtint','gBtint','gAev','gBev','mAmt'];
function tkScaleMix(P){
  var l = P.mixL == null ? 100 : P.mixL, c = P.mixC == null ? 100 : P.mixC;
  if (l >= 100 && c >= 100) return P;
  var Q = {}; for (var k in P) Q[k] = P[k];
  if (l < 100) TK_MIXL.forEach(function(k){ if (typeof Q[k] === 'number') Q[k] = Q[k] * l / 100; });
  if (c < 100) TK_MIXC.forEach(function(k){ if (typeof Q[k] === 'number') Q[k] = Q[k] * c / 100; });
  return Q;
}
function tkProcess(src, w, h, P){
  P = tkScaleMix(P);
  var n = w * h, i, c, x, y, p4;
  var L = Math.max(w, h);
  var img = new Float32Array(n * 3);
  for (i = 0; i < n; i++){
    img[i * 3] = src[i * 4] / 255; img[i * 3 + 1] = src[i * 4 + 1] / 255; img[i * 3 + 2] = src[i * 4 + 2] / 255;
  }

  // 0) 基本補正（露光量・ハイライト・ホワイトバランス・トーンカーブ・カラーミキサーなど）
  tkNoise(img, w, h, P);
  tkBasic(img, w, h, P);
  tkLook2(img, n, P, w, h);
  tkLook3(img, n, P, w, h);
  tkPresence(img, w, h, P);
  tkSkinSmooth(img, w, h, P);
  tkGrade(img, n, P);

  // 1) 自動明るさ（平均の明るさを目標へ。掛け算でなくガンマ＝白と黒は動かさず中間調だけ動かす→白飛びしない）
  if (P.on.bright){
    var sum = 0;
    for (i = 0; i < n; i++) sum += tkLuma(img[i * 3], img[i * 3 + 1], img[i * 3 + 2]);
    var m = Math.min(0.97, Math.max(0.02, sum / n)), tg = Math.min(0.97, Math.max(0.03, P.target / 100));
    var gm = Math.log(tg) / Math.log(m);
    gm = Math.max(0.72, Math.min(1.4, gm));
    if (Math.abs(gm - 1) > 0.004){
      var LUT = new Float32Array(4097);
      for (var q = 0; q <= 4096; q++) LUT[q] = Math.pow(q / 4096, gm);
      for (i = 0; i < n * 3; i++) img[i] = LUT[(img[i] * 4096 + 0.5) | 0];
    }
  }

  // 2) フィルムトーン（黒あげ・白おさえ・コントラスト・彩度）＋スプリットトーン
  if (P.on.tone || P.on.split){
    var lift = P.on.tone ? P.lift / 100 * 0.27 : 0;
    var white = P.on.tone ? 1 - P.roll / 100 * 0.22 : 1;
    var con = P.on.tone ? P.con / 100 : 0;
    var sat = P.on.tone ? 1 + P.sat / 100 : 1;
    var shb = P.on.split ? P.shb / 40 : 0;
    var hiw = P.on.split ? P.hiw / 40 : 0;
    for (i = 0; i < n; i++){
      var r = img[i * 3], g = img[i * 3 + 1], b = img[i * 3 + 2];
      if (P.on.tone){
        var k0 = 1 + con * 1.6;
        r = (r - 0.5) * k0 + 0.5; g = (g - 0.5) * k0 + 0.5; b = (b - 0.5) * k0 + 0.5;
        r = lift + tkClamp01(r) * (white - lift); g = lift + tkClamp01(g) * (white - lift); b = lift + tkClamp01(b) * (white - lift);
        if (sat !== 1){ var y0 = tkLuma(r, g, b); r = y0 + (r - y0) * sat; g = y0 + (g - y0) * sat; b = y0 + (b - y0) * sat; }
      }
      if (shb || hiw){
        var yl = tkLuma(r, g, b);
        var wsh = Math.max(0, 1 - yl * 2), whi = Math.max(0, (yl - 0.5) * 2);
        r += (-wsh * shb + whi * hiw) * 0.085;
        g += whi * hiw * 0.025;
        b += (wsh * shb - whi * hiw) * 0.085;
      }
      img[i * 3] = tkClamp01(r); img[i * 3 + 1] = tkClamp01(g); img[i * 3 + 2] = tkClamp01(b);
    }
  }

  // 2.1) カラーマッチ：参考写真の色（影・中間・光それぞれ）と明るさに寄せる
  if (P.on.match && P.mref && P.mAmt > 0){
    if (P.mref.ref2 && typeof TK_REF2 !== 'undefined' && TK_REF2[P.mref.ref2]) tkRefTransfer(img, n, TK_REF2[P.mref.ref2], P.mAmt / 100, (P.mLum == null ? 70 : P.mLum) / 100);
    else tkColorMatch(img, n, P.mref, P.mAmt / 100, (P.mLum || 0) / 100, P.mMode || 'part');
  }
  // 2.15) 肌（毛色）の色ムラをそろえる
  if (P.on.skin && (P.skAmt > 0 || P.skShift)) tkSkinUnify(img, n, (P.skAmt || 0) / 100, (P.skShift || 0));

  // 2.2) 部分調整：被写体・緑・暖色・白・暗部をマスクで分け、それぞれ別の明るさ・彩度・色温度・色相に
  if (P.on.reg && P.reg && TK_REG && TK_REG.ver === P.reg.ver) tkApplyRegions(img, w, h, P.reg);

  // 2.25) 自由な部分補正（円形・線形・ブラシ）
  tkLocalMasks(img, w, h, P);

  // 2.3) 寒暖グラデーション（線形）：始点側と終点側に別々の色温度・明るさ
  if (P.on.grad) tkLinearGrad(img, w, h, P);

  // 2.4) シャープ（光の効果をかける前に輪郭を整える）
  tkSharpen(img, w, h, P);

  // 2.5) 濃さ（Density／減法的な彩度）：色が濃い画素ほど暗く沈める。くすんだ色・グレー・白はほぼ動かない
  //   A=全色一律 / B=肌（橙）を守る / C=色ごと（赤・橙・黄・緑・水・青・紫）
  if (P.on.dens && P.dens > 0){
    var dk = P.dens / 100 * 0.55, dmode = P.dmode || 'B';
    var prot = (P.dskin || 0) / 100;
    var HA = [0, 30, 60, 120, 180, 230, 290, 360];
    var HW = [P.dR, P.dO, P.dY, P.dG, P.dC, P.dB, P.dM, P.dR].map(function(v){ return (v == null ? 50 : v) / 50; });
    var HUE = new Float32Array(361);
    for (var hd = 0; hd <= 360; hd++){
      var wv = 1;
      if (dmode === 'B'){ var dd = Math.min(Math.abs(hd - 28), 360 - Math.abs(hd - 28)); wv = 1 - prot * Math.exp(-(dd / 17) * (dd / 17)); }
      else if (dmode === 'C'){ for (var ai = 0; ai < 7; ai++) if (hd >= HA[ai] && hd <= HA[ai + 1]){ var tt = (hd - HA[ai]) / (HA[ai + 1] - HA[ai]); wv = HW[ai] + (HW[ai + 1] - HW[ai]) * tt; break; } }
      HUE[hd] = wv;
    }
    for (i = 0; i < n; i++){
      var dr = img[i * 3], dg = img[i * 3 + 1], db = img[i * 3 + 2];
      var mx = Math.max(dr, dg, db), mn = Math.min(dr, dg, db), ch = mx - mn;
      if (ch < 0.004 || mx <= 0) continue;
      var sv = ch / mx, hue;
      if (mx === dr) hue = 60 * (((dg - db) / ch) % 6); else if (mx === dg) hue = 60 * ((db - dr) / ch + 2); else hue = 60 * ((dr - dg) / ch + 4);
      if (hue < 0) hue += 360;
      var amt = dk * HUE[hue | 0] * Math.pow(sv, 1.15) * tkSS(ch / 0.22);
      if (amt <= 0) continue;
      var f = 1 - Math.min(0.8, amt);
      img[i * 3] = dr * f; img[i * 3 + 1] = dg * f; img[i * 3 + 2] = db * f;
    }
  }

  var doDiff = P.on.diff && P.diff > 0, doGlow = P.on.glow && P.glow > 0, doHal = P.on.hal && P.hal > 0, doMist = P.on.mist && P.mist > 0;
  var sD = L * (P.diffR * 0.0006);          // にじみの広がり
  var sG = L * (P.glowR * 0.001);           // グローの広がり
  var sH = L * (P.glowR * 0.0007);          // ハレーションの広がり
  var sM = L * (P.diffR * 0.0009);          // ミストの広がり
  var t0 = P.thr / 100;

  // 3a) 周囲の平均の明るさ（「周りより明るい所だけ光らせる」判定用）とミスト用の縮小データ
  var LM = null, MG = null;
  if (doGlow || doMist){
    var GL = doGlow ? tkGrid(w, h, Math.floor(sG * 1.5 / 3)) : null;
    MG = doMist ? tkGrid(w, h, Math.floor(sM / 3)) : null;
    for (y = 0; y < h; y++) for (x = 0; x < w; x++){
      i = y * w + x;
      if (GL){ var yv = tkLuma(img[i * 3], img[i * 3 + 1], img[i * 3 + 2]); tkGridAdd(GL, x, y, yv, 0, 0, 1); }
      if (MG) tkGridAdd(MG, x, y, img[i * 3], img[i * 3 + 1], img[i * 3 + 2], 1);
    }
    if (GL) LM = tkRowReader(tkBlurGrid(tkGridDone(GL), sG * 1.5), w);
    if (MG) MG = tkRowReader(tkBlurGrid(tkGridDone(MG), sM), w);
  }

  // 3b) 光源の抽出（色はそのまま、強さを重みに）＋ミスト適用
  //   にじみ・ハレーション用 = 明るさで判定 / グロー用 = 周りより明るい所（きらめき・窓の縁）を優先
  var HS = (doDiff || doHal) ? tkGrid(w, h, Math.floor(Math.min(sD, sH * 0.3) / 3)) : null;
  var GS = doGlow ? tkGrid(w, h, Math.floor(sG / 3)) : null;
  var mo = doMist ? P.mist / 100 * 0.35 : 0;
  if (HS || GS || MG){
    for (y = 0; y < h; y++){
      var lmr = LM ? LM(y) : null, mr = MG ? MG(y) : null;
      for (x = 0; x < w; x++){
        i = y * w + x;
        var R = img[i * 3], Gc = img[i * 3 + 1], Bc = img[i * 3 + 2];
        var yy = tkLuma(R, Gc, Bc);
        if (HS){
          var wa = tkSS((yy - (t0 - 0.05)) / Math.max(0.02, 1 - (t0 - 0.05)));
          tkGridAdd(HS, x, y, R * wa, Gc * wa, Bc * wa, wa);
        }
        if (GS){
          var wa2 = tkSS((yy - t0) / Math.max(0.02, 1 - t0));
          var wc = tkSS((yy - lmr[x * 4] - 0.02) / 0.16);
          var wg = wa2 * wa2 * (0.2 + 0.8 * wc);
          tkGridAdd(GS, x, y, R * wg, Gc * wg, Bc * wg, wg);
        }
        if (mr){
          p4 = x * 4;
          img[i * 3] = R + (mr[p4] - R) * mo; img[i * 3 + 1] = Gc + (mr[p4 + 1] - Gc) * mo; img[i * 3 + 2] = Bc + (mr[p4 + 2] - Bc) * mo;
        }
      }
    }
    if (HS) tkGridDone(HS);
    if (GS) tkGridDone(GS);
  }

  // 4) ハイライト余白（なめらかな肩で白を少し沈め、滲みを乗せる余地を作る）
  if (P.on.comp && P.comp > 0){
    var knee = 0.75, cp = P.comp / 100;
    for (i = 0; i < n * 3; i++){
      var x5 = img[i];
      if (x5 > knee){ var u = (x5 - knee) / (1 - knee); img[i] = knee + (1 - knee) * u * (1 - 0.45 * cp * u); }
    }
  }

  // 5) 光のにじみ＝輪郭ソフト（比較（明）：明部の光が暗い隣へだけ漏れる。芯はそのまま）
  if (doDiff){
    var DR = tkRowReader(tkBlurGrid(HS, sD), w);
    var dop = P.diff / 100;
    for (y = 0; y < h; y++){
      var rd = DR(y);
      for (x = 0; x < w; x++){
        p4 = x * 4; var sa = rd[p4 + 3];
        if (sa > 1e-4){
          i = y * w + x;
          var al = Math.min(1, sa * 1.8) * dop;
          for (c = 0; c < 3; c++){ var cc2 = rd[p4 + c] / sa, base = img[i * 3 + c]; if (cc2 > base) img[i * 3 + c] = base + (cc2 - base) * al; }
        }
      }
    }
  }

  // 6) グロー（タイト＋広域、スクリーン）
  if (doGlow){
    var G1 = tkRowReader(tkBlurGrid(GS, sG), w), G2 = tkRowReader(tkBlurGrid(GS, sG * 3), w);
    var k1 = P.glow / 100 * 1.6, k2 = P.glow / 100 * 0.5;
    for (y = 0; y < h; y++){
      var r1 = G1(y), r2 = G2(y);
      for (x = 0; x < w; x++){
        i = y * w + x; p4 = x * 4;
        for (c = 0; c < 3; c++){
          var v = img[i * 3 + c];
          v = 1 - (1 - v) * (1 - tkClamp01(r1[p4 + c] * k1));
          v = 1 - (1 - v) * (1 - tkClamp01(r2[p4 + c] * k2));
          img[i * 3 + c] = v;
        }
      }
    }
  }

  // 6.5) 光の差し込み（窓の光／光漏れ）
  if (P.on.ray && P.rAmt > 0) tkRays(img, w, h, P);

  // 7) ハレーション（光源の芯は白のまま、外へ広がった分だけ赤橙に＝ぼかし差分）
  if (doHal){
    var HB = tkRowReader(tkBlurGrid(HS, sH), w), HN = tkRowReader(tkBlurGrid(HS, Math.max(1, sH * 0.3)), w);
    var hk = P.hal / 100 * 1.6;
    for (y = 0; y < h; y++){
      var rh = HB(y), rn = HN(y);
      for (x = 0; x < w; x++){
        i = y * w + x;
        var fr = Math.max(0, rh[x * 4 + 3] - rn[x * 4 + 3]) * hk;
        if (fr > 0){
          img[i * 3] = 1 - (1 - img[i * 3]) * (1 - tkClamp01(fr));
          img[i * 3 + 1] = 1 - (1 - img[i * 3 + 1]) * (1 - tkClamp01(fr * 0.42));
          img[i * 3 + 2] = 1 - (1 - img[i * 3 + 2]) * (1 - tkClamp01(fr * 0.2));
        }
      }
    }
  }

  // 7.5) オールドレンズ風（色にじみ・周辺の流れ・ベール・周辺減光）

// ---------- 肌をなめらかに（肌の色の所だけ、ムラとざらつきを整え、細かい質感は残す） ----------

}

// TK_REG = { mw, mh, n, data: Uint8Array(mw*mh*n), ver }  … 0:被写体 1:緑 2:暖色 3:白 4:暗部
var TK_REG = null;
var TK_REG_N = 5;
function tkSetRegions(r){ TK_REG = r; }
// 明るさ（-1〜+1）用のLUT：明るくする時は白を飛ばさない肩、暗くする時は黒をつぶさない
function tkEvLut(ev){
  var L = new Float32Array(1025), k = Math.pow(2, Math.abs(ev) * 1.2);
  for (var i = 0; i <= 1024; i++){
    var c = i / 1024;
    L[i] = ev >= 0 ? 1 - Math.pow(1 - c, k) : Math.pow(c, k);
  }
  return L;
}
function tkRegPrep(a){
  // a: {ev,sat,temp,tint,hue} は -100〜100（色相は -30〜30 度）
  var ev = (a.ev || 0) / 100, h = (a.hue || 0) * Math.PI / 180;
  return { lut: ev ? tkEvLut(ev) : null, sat: 1 + (a.sat || 0) / 100, t: (a.temp || 0) / 100, ti: (a.tint || 0) / 100,
           ch: Math.cos(h), sh: Math.sin(h), hue: !!a.hue,
           any: !!(ev || a.sat || a.temp || a.tint || a.hue) };
}
function tkRegAdj(r, g, b, q, out){
  if (q.lut){ r = q.lut[(tkClamp01(r) * 1024 + 0.5) | 0]; g = q.lut[(tkClamp01(g) * 1024 + 0.5) | 0]; b = q.lut[(tkClamp01(b) * 1024 + 0.5) | 0]; }
  if (q.t){ r += q.t * 0.055; g += q.t * 0.012; b -= q.t * 0.07; }
  if (q.ti){ r += q.ti * 0.03; g -= q.ti * 0.05; b += q.ti * 0.03; }

    var Y = 0.299 * r + 0.587 * g + 0.114 * b, I = 0.596 * r - 0.274 * g - 0.322 * b, Q = 0.211 * r - 0.523 * g + 0.312 * b;
    var I2 = (I * q.ch - Q * q.sh) * q.sat, Q2 = (I * q.sh + Q * q.ch) * q.sat;

  }

}
function tkApplyRegions(img, w, h, R){

          r += (rr - r) * gw; g += (gg - g) * gw; b += (bb - b) * gw;
        }
      }

    }
  }
}

// ---- マスク作成（メインスレッドで使用。純関数） ----
function tkSS2(a, b, v){ return tkSS((v - a) / (b - a)); }
// 1チャンネルのぼかし（ボックス3回）

  for (var p = 0; p < 3; p++){
    for (y = 0; y < h; y++){
      var o = y * w; acc = 0;
      for (x = -r; x <= r; x++) acc += a[o + (x < 0 ? 0 : x >= w ? w - 1 : x)];
      for (x = 0; x < w; x++){ t[o + x] = acc * inv; acc += a[o + (x + r + 1 >= w ? w - 1 : x + r + 1)] - a[o + (x - r < 0 ? 0 : x - r)]; }
    }
    for (x = 0; x < w; x++){
      acc = 0;
      for (y = -r; y <= r; y++) acc += t[(y < 0 ? 0 : y >= h ? h - 1 : y) * w + x];
      for (y = 0; y < h; y++){ a[y * w + x] = acc * inv; acc += t[(y + r + 1 >= h ? h - 1 : y + r + 1) * w + x] - t[(y - r < 0 ? 0 : y - r) * w + x]; }
    }
  }

        // 青を馴染ませる：鮮やかな青ほど彩度を少し落とし、周りの明るさに寄せる（他の色から浮いてパキッと見えない）
        if (bl && C > 0.01){
          var wb = (1 - tkSS((Math.abs(tkHueDist(h, 240)) - 35) / 25)) * tkSS((C - 0.03) / 0.08);
          if (wb > 0){ C *= 1 - bl * 0.35 * wb; Lk += (0.6 - Lk) * bl * 0.08 * wb; h += (215 - h) * bl * 0.15 * wb; }
        }

        var hr = h * Math.PI / 180; tkFromOk(Lk, Math.cos(hr) * C, Math.sin(hr) * C, k); R = k[0]; G = k[1]; B = k[2];
      }

    }
    TK_LUTC.lkK = key; TK_LUTC.lk = LUT;
    // 守る側の表：明るさ（コントラスト）は青の光と同じ、色（色相・彩度）は元のまま＋ほんの少し暖かく
    //   と、元の色から決める「守る強さ」（肌・暖色・はっきりした色ほど強く、青・白・灰色は守らない）
    var LP = new Float32Array(N3 * N3 * N3 * 3), LS = new Float32Array(N3 * N3 * N3 * 3), CW = new Float32Array(N3 * N3 * N3), q = 0, ko = [0, 0, 0], ki = [0, 0, 0], kp = [0, 0, 0];

      var Ci = Math.sqrt(ki[1] * ki[1] + ki[2] * ki[2]), hi = Math.atan2(ki[2], ki[1]) * 180 / Math.PI; if (hi < 0) hi += 360;
      var aa = ki[1] * 0.85 + ko[1] * 0.15, bb2 = ki[2] * 0.85 + ko[2] * 0.15;
      aa += Math.cos(58 * Math.PI / 180) * 0.006 * wm; bb2 += Math.sin(58 * Math.PI / 180) * 0.006 * wm;
      tkFromOk(ko[0], aa, bb2, kp); LP[i3 * 3] = tkClamp01(kp[0]); LP[i3 * 3 + 1] = tkClamp01(kp[1]); LP[i3 * 3 + 2] = tkClamp01(kp[2]);
      var kq = [ko[0], aa, bb2]; tkLkSkinFix(kq, sk); tkFromOk(kq[0], kq[1], kq[2], kp); LS[i3 * 3] = tkClamp01(kp[0]) - LP[i3 * 3]; LS[i3 * 3 + 1] = tkClamp01(kp[1]) - LP[i3 * 3 + 1]; LS[i3 * 3 + 2] = tkClamp01(kp[2]) - LP[i3 * 3 + 2];
      var blueW = 1 - tkSS((Math.abs(tkHueDist(hi, 245)) - 40) / 25);
      CW[i3] = tkSS((Ci - 0.03) / 0.05) * (1 - blueW);
    }

  }
  var prot = (P.lkProt == null ? 80 : P.lkProt) / 100;

  var cm = (P.lkSplit && P.mix != null) ? Math.max(0, Math.min(100, P.mix)) / 100 : 1;
  var I1 = cm < 1 ? new Float32Array(img) : null;
  // 明るさの作りと肌は、強さを下げても半分以上は残す（色だけ薄くして、トーン・肌を全開にすると色が割れるため）
  var tm = 0.55 + 0.45 * cm, ks = 0.5 + 0.5 * cm;
  // 背景（人物・守る色の外）は色を多めに：人物は守ったまま、空気の青だけをはっきり
  var cmB = Math.min(1, cm * (P.lkBg == null ? 1 : P.lkBg / 100));
  if (prot <= 0 && !sk && !I1){ tkApplyLut3(img, n, TK_LUTC.lk, 33); return; }

  var I0 = SK ? new Float32Array(img) : null;
  tkApplyLut3(A, n, TK_LUTC.lk, 33); tkApplyLut3(B, n, TK_LUTC.lkP, 33);
  // 肌の補正（差分の表）：AIで人物が分かっている時は人物の範囲の中だけ、分からない時は色だけで
  if (D){ var LSo = TK_LUTC.lkS, L3 = new Float32Array(LSo.length); for (var q3 = 0; q3 < LSo.length; q3++) L3[q3] = LSo[q3] + 0.5; tkApplyLut3(D, n, L3, 33); }
  var CWt = TK_LUTC.lkCW, ko2 = [0, 0, 0];

    var ir = (img[j] * 32 + 0.5) | 0, ig = (img[j + 1] * 32 + 0.5) | 0, ib = (img[j + 2] * 32 + 0.5) | 0;
    var cw = CWt[(ib * 33 + ig) * 33 + ir], sw = SW ? SW[i] : 0, wt = Math.max(cw * 0.85, sw) * prot;
    img[j] = A[j] + (B[j] - A[j]) * wt; img[j + 1] = A[j + 1] + (B[j + 1] - A[j + 1]) * wt; img[j + 2] = A[j + 2] + (B[j + 2] - A[j + 2]) * wt;
    if (I1){
      tkToOk(I1[j], I1[j + 1], I1[j + 2], ko2); var l0 = ko2[0], a0 = ko2[1], b0 = ko2[2];
      tkToOk(img[j], img[j + 1], img[j + 2], ko2);
      var cmx = cm + (cmB - cm) * (1 - Math.min(1, wt / Math.max(prot, 0.01)));
      tkFromOk(l0 + (ko2[0] - l0) * tm, a0 + (ko2[1] - a0) * cmx, b0 + (ko2[2] - b0) * cmx, ko2); img[j] = tkClamp01(ko2[0]); img[j + 1] = tkClamp01(ko2[1]); img[j + 2] = tkClamp01(ko2[2]);
    }
    if (D){ img[j] = tkClamp01(img[j] + (D[j] - 0.5) * ks); img[j + 1] = tkClamp01(img[j + 1] + (D[j + 1] - 0.5) * ks); img[j + 2] = tkClamp01(img[j + 2] + (D[j + 2] - 0.5) * ks); }
    if (SK && sw > 0.15){
      tkToOk(I0[j], I0[j + 1], I0[j + 2], ko2);

        var Cq = Math.sqrt(ko2[1] * ko2[1] + ko2[2] * ko2[2]);
        var ws2 = Math.exp(-dd / (2 * 0.011 * 0.011)) * tkSS((Cq - 0.006) / 0.006) * tkSS((sw - 0.15) / 0.5) * tkSS((ko2[0] - 0.3) / 0.1) * (1 - tkSS((ko2[0] - 0.84) / 0.06));
        if (ws2 > 0.01){
          tkToOk(img[j], img[j + 1], img[j + 2], ko2);

          tkFromOk(ko2[0], ko2[1], ko2[2], ko2); img[j] = tkClamp01(ko2[0]); img[j + 1] = tkClamp01(ko2[1]); img[j + 2] = tkClamp01(ko2[2]);

    }
  }
}

    Object.keys(DEFAULTS).forEach(function(k){ if (MANUAL_FX_KEYS[k] && key !== 'none') return; q[k] = (key !== 'none' && k in p) ? p[k] : DEFAULTS[k]; });
    Object.keys(q.on).forEach(function(k){ if (KEEP_ON[k] || (MANUAL_FX[k] && key !== 'none')) return; q.on[k] = (key !== 'none' && p.on && (k in p.on)) ? (p.on[k] ? 1 : 0) : (OFF_KEYS[k] ? 0 : 1); });
    if (key !== 'none' && p.full) fullInto(q, p.full, false); else if (LAST_FULL) fullInto(q, null, false);
    q.on.reg = 0; return q;
  }
  function renderLookThumbs(){
    if (!img) return;
    var my = ++thumbGen, sz = sizeFor(200), src = readPixels(sz[0], sz[1]);
    var tiles = Array.prototype.slice.call(pbox.children);
    (function next(i){
      if (my !== thumbGen || i >= tiles.length) return;
      var t = tiles[i], q = presetParams(t.dataset.p);
      if (q){
        try{
          var out = tkProcess(src, sz[0], sz[1], q), c = document.createElement('canvas'); c.width = sz[0]; c.height = sz[1];
          c.getContext('2d', { colorSpace: CS }).putImageData(mkImageData(out, sz[0], sz[1]), 0, 0);
          var cv = t.querySelector('canvas'), x = cv.getContext('2d', { colorSpace: CS }); x.clearRect(0, 0, cv.width, cv.height);
          var s = Math.max(cv.width / sz[0], cv.height / sz[1]); x.drawImage(c, (cv.width - sz[0] * s) / 2, (cv.height - sz[1] * s) / 2, sz[0] * s, sz[1] * s);
        }catch(e){}
      }
      setTimeout(function(){ next(i + 1); }, 0);
    })(0);
  }
  // ---- 取り消し／やり直し ----
  var HIST = [], REDO = [], restoring = false, histTimer = null;
  function snapState(){ var q = JSON.parse(JSON.stringify(P)); delete q.reg.ver; return JSON.stringify(q); }
  function applyState(str){
    restoring = true;
    var d = JSON.parse(str), ver = P.reg.ver;
    Object.keys(d).forEach(function(k){ P[k] = d[k]; });
    P.reg.ver = ver;
    GROUPS.forEach(function(g){ (g.sliders || []).forEach(function(s){ if (P[s[0]] != null) setVal(s[0], P[s[0]]); }); });
    Object.keys(P.on).forEach(function(k){ syncGroup(k); });
    $('s-mix').value = P.mix; $('v-mix').textContent = P.mix;
    ['mixL', 'mixC'].forEach(function(k){ var v = P[k] == null ? 100 : P[k]; P[k] = v; $('s-' + k).value = v; $('v-' + k).textContent = v; });
    setMode(P.dmode || 'B'); updateRegUI(); updateExtras(); markPreset('__none__');
    schedule(); restoring = false; updateHistBtns();
  }
  function updateHistBtns(){ $('undo').disabled = HIST.length < 2; $('redo').disabled = !REDO.length; try{ renderHist(); }catch(e){} }
  function noteChange(){
    sessSaveState();
    if (restoring) return;
    clearTimeout(histTimer);
    histTimer = setTimeout(function(){
      var s = snapState(); if (HIST.length && HIST[HIST.length - 1] === s) return;
      HIST.push(s); if (HIST.length > 60) HIST.shift(); REDO = []; updateHistBtns();
    }, 450);
  }
  (function(){ var t = null, lp = false, u = $('undo'); u.addEventListener('pointerdown', function(){ lp = false; t = setTimeout(function(){ lp = true; setCollapsed(false); showTab('util', 'hist'); }, 500); }); ['pointerup', 'pointerleave', 'pointercancel'].forEach(function(e){ u.addEventListener(e, function(){ clearTimeout(t); }); }); u.addEventListener('click', function(e){ if (lp){ e.stopImmediatePropagation(); lp = false; } }, true); })();
  $('undo').addEventListener('click', function(){ if (HIST.length < 2) return; REDO.push(HIST.pop()); applyState(HIST[HIST.length - 1]); toast('取り消しました'); });
  $('redo').addEventListener('click', function(){ if (!REDO.length) return; var s = REDO.pop(); HIST.push(s); applyState(s); toast('やり直しました'); });
  HIST.push(snapState());
  // 変更のたびに：印の更新と履歴
  var _sched0 = schedule;
  schedule = function(){ _sched0(); updateIndicators(); noteChange(); };
  // 自分の設定が増減したら見本の列も作り直す
  var _ux0 = updateExtras;
  updateExtras = function(){ _ux0(); var n = Object.keys(mpLoad()).length; if (n !== buildLookTiles._n){ buildLookTiles._n = n; buildLookTiles(); renderLookThumbs(); } };
  try{ if (window.matchMedia('(pointer:fine)').matches) $('dropBig').textContent = 'クリックして選択、またはここへドラッグ'; }catch(e){}
  showTab('look');
  buildHisto();
  setTimeout(sessRestore, 50);   // 前回の続きから
  setTimeout(function(){ var on = false; try{ on = localStorage.getItem('retouch-aiauto') === '1'; }catch(e){} if (!on) return; aiCachedCount().then(function(c){ if (c >= 0 && c < aiFiles().length) aiPrepare(true); }); }, 4000);   // 自動準備（ONの時だけ）

  var tt = null;
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('show'); }, 2200); }
})();
</script>
<script>
// 更新を確実に反映：保存の仕組み（sw.js）は毎回サーバーに確認し、新しい版に切り替わったら1度だけ読み直す
if ("serviceWorker" in navigator && location.protocol === "https:"){
  var hadSW = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function(r){
    r.update();
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") r.update(); });
  }).catch(function(){});
  navigator.serviceWorker.addEventListener("controllerchange", function(){ if (hadSW && !reloaded && !window.TK_BUSY_IMG){ reloaded = true; location.reload(); } });
}
</script>
