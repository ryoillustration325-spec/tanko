<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>photo retouch</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D0F11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="photo retouch">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* 写真編集アプリとして、暗い面で統一（写真の色を正しく見るため。Lightroomと同じ考え方） */
  /* レイアウト：上＝操作バー／中央＝写真／下＝選んだ機能のパネル／最下段＝5つのアイコン。広い画面は右に操作列 */
  :root{
    --bg:#0D0F11; --surface:#16191C; --surface2:#1E2226; --ink:#E6EBEF; --muted:#9AA6AF; --faint:#6C7880;
    --accent:#8FB0C4; --warm:#E0A36B; --line:#2A3036; --line-soft:#22272C; --warn:#E0A36B;
    --shadow:0 12px 32px -16px rgba(0,0,0,.8);
    --f-ui:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans",system-ui,sans-serif; --f-num:"Inter",-apple-system,system-ui,sans-serif;
    --tabh:58px; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%; background:var(--bg); overflow:hidden}
  body{background:var(--bg); color:var(--ink); font-family:var(--f-ui); -webkit-font-smoothing:antialiased; line-height:1.55;
    -webkit-tap-highlight-color:transparent; overflow:hidden; overscroll-behavior:none}
  .num{font-family:var(--f-num); font-variant-numeric:tabular-nums}
  input[type=file]{display:none; color-scheme:dark}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .app{position:fixed; top:0; right:0; bottom:0; left:0; height:auto; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto auto;
    grid-template-areas:"top" "stage" "sheet" "tabs";
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
  .topbar{grid-area:top; min-width:0; position:relative; z-index:7; background:var(--bg); display:flex; align-items:center; gap:8px; padding:8px 12px; min-height:52px}
  .tb{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500; padding:8px 13px; border-radius:18px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; -webkit-user-select:none; user-select:none; white-space:nowrap}
  .tb.pri{background:var(--accent); color:#0E1418; border-color:transparent; font-weight:600}
  .tb:disabled{opacity:.4; cursor:default}
  #cmp{touch-action:none}
  .tbmid{flex:1; display:flex; justify-content:center; gap:6px}
  .ib{width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); cursor:pointer; padding:0}
  .ib:disabled{opacity:.3; cursor:default}
  .ib svg,.tab svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}

  .stagewrap{grid-area:stage; min-height:0; position:relative; padding:0 8px 8px}
  .stage{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:10px; background:#08090A}
  .stage canvas{display:block; max-width:100%; max-height:100%; width:auto; height:auto}
  /* 写真の選択：写真を置く場所のどこを押しても選択（透明な入力欄を全面に重ね、指で直接押す形。プログラムから押すと白いちらつきが出るため使わない）。
     iPhoneの選択メニューは押した指の位置に出る（iOSの仕様） */
  .drop{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; width:100%; height:100%; padding:24px; -webkit-user-select:none; user-select:none}
  .dropbtn{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-width:min(280px,84%); min-height:170px; padding:28px 32px 24px; border-radius:22px;
    background:rgba(255,255,255,.03); border:1px dashed rgba(255,255,255,.14); transition:background-color .15s, border-color .15s}
  .drop{position:relative}
  .drop > input[type=file]{display:block; position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:16px; z-index:2; color-scheme:dark}
  .app:not(.collapsed) .drop{padding-bottom:calc(min(32dvh,270px) + 8px)}  /* 下のパネルに隠れない位置で中央に */
  @media (min-width:900px), (min-width:600px) and (orientation:landscape){ .app:not(.collapsed) .drop{padding-bottom:24px} }
  .dropbtn.press{background:var(--surface); border-color:var(--accent)}
  @media (hover:hover){ .dropbtn:hover{background:var(--surface); border-color:var(--line)} }
  .drop .big{font-size:16px; font-weight:500}
  .drop .sub{font-size:12px; color:var(--faint)}
  .drop .mark{width:64px; height:64px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--accent); margin-bottom:6px}
  .drop .mark svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.6}
  body.dragging .stage{outline:2px dashed var(--accent); outline-offset:-8px}
  .chip{position:absolute; top:10px; background:rgba(13,15,17,.72); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:4px 10px; font-size:11px; color:#E6EBEF; display:none}
  .chip.left{left:10px}
  .chip .warn{color:#F0B47E}
  .busy{position:absolute; left:50%; top:10px; transform:translateX(-50%); white-space:nowrap; font-size:11px; color:#E6EBEF; background:rgba(13,15,17,.78);
    border-radius:14px; padding:4px 10px; display:none}
  #size{display:none !important}

  /* パネルは写真の上に半透明で重ねる（写真の大きさは常に同じ。Lightroomと同じ） */
  .sheet{grid-area:stage; align-self:end; z-index:5; min-height:0; min-width:0; height:min(32vh, 270px); height:min(32dvh, 270px); touch-action:pan-y; display:flex; flex-direction:column;
    margin:0 8px; border-radius:16px 16px 0 0; background:rgba(16,18,21,.72); -webkit-backdrop-filter:blur(16px) saturate(1.1); backdrop-filter:blur(16px) saturate(1.1);
    border:1px solid rgba(255,255,255,.06); border-bottom:0; transition:transform .22s ease, opacity .22s ease, height .22s ease, background-color .22s ease}
  .app.expanded .sheet{height:100%; background:rgba(16,18,21,.9)}
  .app.collapsed .sheet{transform:translateY(calc(100% - 30px)); opacity:.94}
  .sheet.dragging{transition:none}
  .grab{flex:none; height:30px; display:flex; align-items:center; justify-content:center; cursor:grab; border:0; background:transparent; width:100%; padding:0; touch-action:none}
  .grab::before{content:""; width:44px; height:5px; border-radius:3px; background:rgba(255,255,255,.32)}
  /* 写真だけを見る：上下の操作部分を隠す（場所は空けたままなので写真の大きさは変わらない） */
  .topbar,.tabbar{transition:opacity .22s ease}
  .app.immersive .topbar,.app.immersive .tabbar{opacity:0; pointer-events:none}
  .app.immersive .sheet{transform:translateY(105%) !important; opacity:0; pointer-events:none}
  .app.immersive .chip{opacity:0}
  .app.collapsed .grab::before{background:rgba(255,255,255,.5)}
  .sheet .row input[type=range]{background:rgba(255,255,255,.18)}
  .sheet .group.off .gbody{opacity:.5}
  .subtabs{display:flex; gap:6px; overflow-x:auto; padding:2px 12px 4px; scrollbar-width:none; flex:none}
  .subtabs::-webkit-scrollbar{display:none}
  .subtabs:empty{display:none}
  .stab{flex:none; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:7px 12px; border-radius:16px; border:1px solid rgba(255,255,255,.12);
    background:rgba(0,0,0,.18); color:var(--muted); cursor:pointer; white-space:nowrap}
  .stab.on{background:var(--surface2); color:var(--ink); border-color:var(--accent)}
  .stab i,.tab i{width:6px; height:6px; border-radius:50%; background:var(--warm); display:none}
  .stab.act i,.tab.act i{display:block}
  .panel{flex:1; min-height:0; min-width:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 12px 14px}
  .tabbar{grid-area:tabs; min-width:0; position:relative; z-index:7; display:grid; grid-template-columns:repeat(6,1fr); border-top:1px solid var(--line-soft); background:var(--bg);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab{position:relative; height:var(--tabh); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:0; background:transparent;
    color:var(--faint); font-size:10.5px; cursor:pointer}
  .tab.on{color:var(--ink)}
  .tab.on svg{stroke:var(--accent)}
  .tab i{position:absolute; top:9px; right:calc(50% - 16px)}
  .toast{position:fixed; left:50%; top:calc(64px + env(safe-area-inset-top,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg);
    padding:9px 16px; border-radius:20px; font-size:12.5px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; max-width:90vw; text-align:center}
  .toast.show{opacity:1}
  /* パネルの中のグループ（カードではなく、区切り線で並べる） */
  .panel .group{background:transparent; border:0; border-radius:0; margin:0; border-bottom:1px solid var(--line-soft)}
  .panel .group:last-child{border-bottom:0}
  .panel .ghead{padding:10px 2px 6px; cursor:default}
  .panel .caret{display:none}
  .panel .gbody{display:block; padding:0 2px 10px}
  .panel .row label{width:96px}
  /* 仕上げ：見本付きプリセット */
  .looks{max-width:100%; min-width:0; display:flex; gap:10px; overflow-x:auto; padding:6px 2px 10px; scrollbar-width:none}
  .looks::-webkit-scrollbar{display:none}
  .pchip{flex:none; width:76px; display:flex; flex-direction:column; align-items:center; gap:5px; border:0; background:transparent; color:var(--muted); font-size:11px; cursor:pointer; padding:0}
  .pchip canvas,.pchip .ph{width:76px; height:96px; border-radius:8px; display:block; background:var(--surface2); border:2px solid transparent; object-fit:cover}
  .pchip.on{color:var(--ink); font-weight:600}
  .pchip.on canvas,.pchip.on .ph{border-color:var(--accent)}
  .pchip .nm{max-width:76px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pchip.mine .nm::before{content:"★ "; color:var(--warm)}
  .lookrow{display:flex; gap:8px; align-items:center}
  .lookrow .rbtn{flex:1}
  .aibtn{background:linear-gradient(180deg, rgba(143,176,196,.16), rgba(143,176,196,.06)); border-color:rgba(143,176,196,.45) !important}

  /* 広い画面（PC・タブレット・スマホ横向き）：左に写真、右に操作列 */
  @media (min-width:900px), (min-width:600px) and (orientation:landscape){
    .app{grid-template-columns:minmax(0,1fr) clamp(320px,32vw,400px); grid-template-rows:auto auto minmax(0,1fr);
      grid-template-areas:"top top" "stage tabs" "stage sheet"}
    .stagewrap{padding:0 0 12px 12px}
    .tabbar{border-top:0; border-bottom:1px solid var(--line-soft); padding-bottom:0}
    .sheet{grid-area:sheet; align-self:stretch; height:auto; margin:0; border-radius:0; border:0; background:var(--bg); -webkit-backdrop-filter:none; backdrop-filter:none; transform:none !important; opacity:1 !important}
    .grab{display:none}
    .app.immersive .sheet{transform:none !important}
    .app.expanded .sheet{height:auto}
    .toast{top:auto; bottom:24px}
  }
  .sect{font-size:11px; letter-spacing:.18em; color:var(--faint); margin:18px 2px 2px; font-family:"Inter",sans-serif}
  .group{background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-top:8px; overflow:hidden}
  .ghead{display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer}
  .ghead .t{flex:1; font-size:13.5px; font-weight:500}
  .ghead .t small{display:block; color:var(--faint); font-weight:400; font-size:11px; margin-top:1px}
  .caret{color:var(--faint); font-size:11px; transition:transform .15s}
  .group.open .caret{transform:rotate(90deg)}
  .tg{width:40px; height:24px; border-radius:12px; background:var(--line); position:relative; flex:none; border:0; padding:0; cursor:pointer}
  .tg::after{content:""; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .15s}
  .tg.on{background:var(--accent)}
  .tg.on::after{left:18px}
  .gbody{padding:0 14px 12px; display:none}
  .group.open .gbody{display:block}
  .group.off .gbody{opacity:.45}
  .row{display:flex; align-items:center; gap:12px; padding:7px 0}
  .row label{font-size:12px; color:var(--muted); width:84px; flex:none}
  .row input[type=range]{flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; background:var(--line); outline:none}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--accent); cursor:pointer; border:3px solid var(--surface)}
  .row input[type=range]::-moz-range-thumb{width:18px; height:18px; border-radius:50%; background:var(--accent); cursor:pointer; border:3px solid var(--surface)}
  .row .val{font-family:"Inter",sans-serif; font-size:12px; width:34px; text-align:right}
  .seg{display:flex; gap:4px; padding:4px; margin:4px 0 8px; background:var(--surface2); border:1px solid var(--line-soft); border-radius:10px}
  .seg button{flex:1; font:inherit; font-size:12px; padding:8px 4px; border:0; border-radius:7px; background:transparent; color:var(--muted); cursor:pointer}
  .seg button.on{background:var(--accent); color:#0f1418; font-weight:600}
  /* 追加機能 */
  #gde{position:absolute; pointer-events:none; margin:0 !important; max-width:none !important; max-height:none !important}
  body.picking #view{touch-action:none; cursor:crosshair}
  .thumbrow{display:flex; gap:12px; align-items:flex-start; margin:6px 0 4px}
  .thumb{width:56px; height:56px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); flex:none}
  .tcol{flex:1; min-width:0}
  .tinput{flex:1.6; min-width:0; font:inherit; font-size:13px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface2); color:var(--ink); margin:4px 0 6px}
  .mplist{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 6px}
  .mpchip{display:flex; align-items:center; border:1px solid var(--line); border-radius:16px; background:var(--surface2); overflow:hidden}
  .mpchip button{font:inherit; border:0; background:transparent; color:var(--ink); cursor:pointer}
  .mpname{font-size:12.5px; padding:7px 4px 7px 12px}
  .mpdel{font-size:13px; padding:7px 11px 7px 8px; color:var(--faint) !important}
  .ftable{margin:6px 0 8px; font-size:12px}
  .mtable{margin:2px 0 8px; font-size:12px}
  .mtr{display:grid; grid-template-columns:5.5em 1fr 1fr 6em; gap:8px; padding:6px 2px; border-bottom:1px solid var(--line-soft); align-items:center}
  .mtr span:nth-child(2),.mtr span:nth-child(3){text-align:right}
  .mtr span:last-child{text-align:right}
  .mth{color:var(--faint); font-size:11px; letter-spacing:.06em}
  .mtr .ok{color:var(--accent); font-weight:600}
  .mtr .ng{color:var(--warn); font-weight:600}
  .ftr{display:grid; grid-template-columns:4.5em 1fr 4.5em; gap:8px; padding:6px 2px; border-bottom:1px solid var(--line-soft); align-items:center}
  .fth{color:var(--faint); font-size:11px; letter-spacing:.06em}
  .ftr .ok{color:var(--accent); font-weight:600}
  .ftr .ng{color:var(--warn); font-weight:600}
  .fmodal{position:fixed; inset:0; z-index:20; background:rgba(8,10,12,.72); display:flex; justify-content:center; align-items:flex-start; overflow:auto;
    padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
  .fmodal[hidden]{display:none !important}
  .fpane{width:min(440px,100%); background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow)}
  .fhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  .ftitle{font-size:15px; font-weight:600}
  .fclose{font:inherit; font-size:12.5px; padding:8px 14px; border-radius:16px; border:1px solid var(--line); background:var(--surface2); color:var(--ink); cursor:pointer}
  .fgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; background:var(--bg)}
  .ftile{width:100%; height:auto; aspect-ratio:3/4; display:block}
  .ftile.me{outline:2px solid var(--warn); outline-offset:-2px}
  /* 部分調整 */
  #ovl{position:absolute; pointer-events:none; margin:0 !important; max-width:none !important; max-height:none !important}
  #bcur{position:absolute; pointer-events:none; border:1.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.5); border-radius:50%; display:none; transform:translate(-50%,-50%)}
  body.brushing #view{touch-action:none; cursor:crosshair}
  .rbtn{width:100%; font:inherit; font-size:13px; font-weight:600; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--surface2); color:var(--ink); cursor:pointer; margin:4px 0 6px}
  .rbtn.ghost{font-weight:500; font-size:12px; padding:9px; color:var(--muted)}
  .rbtn:disabled{opacity:.45; cursor:default}
  .rrow{display:flex; gap:6px}
  .rrow .rbtn{flex:1}
  .rstat{font-size:11.5px; color:var(--muted); min-height:18px; margin:2px 0 6px}
  .rchips{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 8px}
  .rchip{display:flex; align-items:center; gap:6px; font:inherit; font-size:12px; padding:7px 11px; border-radius:16px; background:var(--surface2); border:1px solid var(--line); color:var(--muted); cursor:pointer}
  .rchip i{width:10px; height:10px; border-radius:50%; display:block}
  .rchip.on{border-color:var(--accent); color:var(--ink); font-weight:600; box-shadow:inset 0 0 0 1px var(--accent)}
  .rsub{font-size:11px; letter-spacing:.12em; color:var(--faint); margin:12px 0 2px; font-family:"Inter",sans-serif}
  .rline{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12px; color:var(--muted)}
  .rline .sp{flex:1}
  .regwrap.dis .rneed{opacity:.4; pointer-events:none}
  /* 元画像を見ている間：表示を消す（ボタン自体は押したまま反応させるため pointer-events は残す） */
  .app.peek .tabbar,.app.peek .sheet,.app.peek .chip,.app.peek .topbar > *:not(#cmp){opacity:0}
  .app.peek #cmp{opacity:.35}
  .app.peek .sheet{pointer-events:none}
  /* 調整中：動かしている項目だけ残して、ほかは消す（写真全体が見える） */
  .app.sliding .topbar,.app.sliding .tabbar,.app.sliding .chip{opacity:0; pointer-events:none}
  .app.sliding .sheet{background:transparent !important; border-color:transparent; -webkit-backdrop-filter:none; backdrop-filter:none}
  .app.sliding .sheet *{visibility:hidden}
  .app.sliding .sheet .keep,.app.sliding .sheet .keep *{visibility:visible}
  .app.sliding .keep{background:rgba(13,15,17,.62); box-shadow:0 0 0 8px rgba(13,15,17,.62); border-radius:10px; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
  /* カラーグレーディング（写真の下のパネルに収まる大きさ） */
  .cgsel{display:flex; align-items:center; justify-content:center; gap:12px; margin:0 0 8px}
  .cgb{position:relative; width:34px; height:34px; border-radius:50%; border:0; background:transparent; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .cgb .cgdot{width:22px; height:22px; border-radius:50%; display:block; border:1.5px solid rgba(255,255,255,.35)}
  .cgb-s .cgdot{background:#15181b} .cgb-m .cgdot{background:#6d747a} .cgb-h .cgdot{background:#e9edf0} .cgb-g .cgdot{background:linear-gradient(90deg,#15181b 50%,#e9edf0 50%)}
  .cgb .cgx{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:12px; padding:3px 8px; white-space:nowrap}
  .cgb.on .cgdot{outline:2px solid var(--accent); outline-offset:3px}
  .cgb.on .cgx{color:var(--ink); border-color:var(--accent)}
  .cgb-x{width:auto; margin-left:6px}
  .cgb.used::after{content:""; position:absolute; bottom:-5px; left:50%; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--warm)}
  .cgname{display:none}
  /* パネルが小さい時は見出しを省いて、ホイールを写真の下に収める */
  .app:not(.expanded) .panel #g-cg .ghead{display:none}

<script id="tkcore">
// CORE-BEGIN
// 淡光 下ごしらえ — 処理コア（DOM非依存・純関数）
// 入力: RGBA Uint8ClampedArray, 幅, 高さ, パラメータ / 出力: RGBA Uint8ClampedArray
// ぼかしは自前実装（Safariで canvas filter が効かない問題を回避）

function tkClamp01(x){ return x < 0 ? 0 : (x > 1 ? 1 : x); }

// 3回のボックスぼかしでガウスぼかしを近似するためのボックス半径
function tkBoxRadius(sigma){
  var b = Math.round((Math.sqrt(4 * sigma * sigma + 1) - 1) / 2);
  return b < 1 ? 1 : b;
}

function tkBoxH(src, dst, w, h, r){
  var inv = 1 / (2 * r + 1);
  for (var y = 0; y < h; y++){
    var row = y * w * 4;
    for (var c = 0; c < 4; c++){
      var acc = 0, k, xx;
      for (k = -r; k <= r; k++){ xx = k < 0 ? 0 : (k >= w ? w - 1 : k); acc += src[row + xx * 4 + c]; }
      for (var x = 0; x < w; x++){
        dst[row + x * 4 + c] = acc * inv;
        var xo = x - r; if (xo < 0) xo = 0;
        var xi = x + r + 1; if (xi >= w) xi = w - 1;
        acc += src[row + xi * 4 + c] - src[row + xo * 4 + c];
      }
    }
  }
}

// 縦方向は「全列ぶんの累積を1行ずつ進める」方式（メモリを順番に読むので速い）
function tkBoxV(src, dst, w, h, r){
  var inv = 1 / (2 * r + 1), rw = w * 4;
  var acc = new Float32Array(rw), k, yy, j;
  for (k = -r; k <= r; k++){
    yy = k < 0 ? 0 : (k >= h ? h - 1 : k);
    var off = yy * rw;
    for (j = 0; j < rw; j++) acc[j] += src[off + j];
  }
  for (var y = 0; y < h; y++){
    var o = y * rw;
    for (j = 0; j < rw; j++) dst[o + j] = acc[j] * inv;
    var yo = y - r; if (yo < 0) yo = 0;
    var yi = y + r + 1; if (yi >= h) yi = h - 1;
    var oi = yi * rw, oo = yo * rw;
    for (j = 0; j < rw; j++) acc[j] += src[oi + j] - src[oo + j];
  }
}

// 乗算済みRGBA(Float32)をぼかす。大きい半径は縮小してからぼかす（速度対策）
function tkBlur(src, w, h, sigma){
  var f = Math.max(1, Math.floor(sigma / 3));
  var w2 = Math.max(1, Math.ceil(w / f)), h2 = Math.max(1, Math.ceil(h / f));
  var a = new Float32Array(w2 * h2 * 4);
  if (f === 1){
    a.set(src);
  } else {
    var cnt = new Float32Array(w2 * h2);
    for (var y = 0; y < h; y++){
      var yy = (y / f) | 0;
      for (var x = 0; x < w; x++){
        var xx = (x / f) | 0, i = (y * w + x) * 4, j = (yy * w2 + xx) * 4;
        a[j] += src[i]; a[j + 1] += src[i + 1]; a[j + 2] += src[i + 2]; a[j + 3] += src[i + 3];
        cnt[yy * w2 + xx]++;
      }
    }
    for (var k = 0; k < w2 * h2; k++){
      var cc = cnt[k] || 1;
      a[k * 4] /= cc; a[k * 4 + 1] /= cc; a[k * 4 + 2] /= cc; a[k * 4 + 3] /= cc;
    }
  }
  var r = tkBoxRadius(sigma / f);
  var tmp = new Float32Array(a.length);
  for (var p = 0; p < 3; p++){ tkBoxH(a, tmp, w2, h2, r); tkBoxV(tmp, a, w2, h2, r); }
  return { d: a, w: w2, h: h2, f: f };
}

// ぼかし結果を元解像度の「1行ぶん」ずつバイリニア補間で取り出すリーダー
function tkRowReader(B, W){
  var f = B.f, w = B.w, h = B.h, d = B.d;
  var row = new Float32Array(W * 4);
  var xa = new Int32Array(W), xb = new Int32Array(W), xt = new Float32Array(W);
  for (var x = 0; x < W; x++){
    var fx = (x + 0.5) / f - 0.5; if (fx < 0) fx = 0;
    var x0 = fx | 0; if (x0 > w - 1) x0 = w - 1;
    xa[x] = x0 * 4; xb[x] = (x0 + 1 < w ? x0 + 1 : w - 1) * 4; xt[x] = fx - x0;
  }
  return function(y){
    if (f === 1){
      var o = y * w * 4;
      for (var j = 0; j < W * 4; j++) row[j] = d[o + j];
      return row;
    }
    var fy = (y + 0.5) / f - 0.5; if (fy < 0) fy = 0;
    var y0 = fy | 0; if (y0 > h - 1) y0 = h - 1;
    var y1 = y0 + 1 < h ? y0 + 1 : h - 1, ty = fy - y0;
    var r0 = y0 * w * 4, r1 = y1 * w * 4;
    for (var x2 = 0; x2 < W; x2++){
      var a = r0 + xa[x2], b = r0 + xb[x2], c = r1 + xa[x2], e = r1 + xb[x2], tx = xt[x2], p = x2 * 4;
      for (var ch = 0; ch < 4; ch++){
        var top = d[a + ch] + (d[b + ch] - d[a + ch]) * tx;
        var bot = d[c + ch] + (d[e + ch] - d[c + ch]) * tx;
        row[p + ch] = top + (bot - top) * ty;
      }
    }
    return row;
  };
}

function tkLuma(r, g, b){ return 0.2126 * r + 0.7152 * g + 0.0722 * b; }

// 再現性のある乱数（粒子がスライダー操作のたびにチラつかないように）
function tkRng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 縮小グリッド（ぼかし前提のデータは最初から縮小して持つ＝速度とメモリ対策）
function tkGrid(W, H, fs){
  fs = Math.max(1, fs | 0);
  var w2 = Math.ceil(W / fs), h2 = Math.ceil(H / fs);
  return { w: w2, h: h2, f: fs, d: new Float32Array(w2 * h2 * 4), cnt: new Float32Array(w2 * h2) };
}
function tkGridAdd(G, x, y, a, b, c, d){
  var k = ((y / G.f) | 0) * G.w + ((x / G.f) | 0), j = k * 4;
  G.d[j] += a; G.d[j + 1] += b; G.d[j + 2] += c; G.d[j + 3] += d; G.cnt[k]++;
}
function tkGridDone(G){
  for (var k = 0; k < G.w * G.h; k++){
    var c = G.cnt[k] || 1, j = k * 4;
    G.d[j] /= c; G.d[j + 1] /= c; G.d[j + 2] /= c; G.d[j + 3] /= c;
  }
  G.cnt = null;
  return G;
}
function tkBlurGrid(G, sigmaFull){
  var B = tkBlur(G.d, G.w, G.h, Math.max(0.6, sigmaFull / G.f));
  B.f *= G.f;
  return B;
}
function tkSS(t){ t = tkClamp01(t); return t * t * (3 - 2 * t); }

// P（パラメータ）: 0–100のスライダー値そのまま。on.* でグループのON/OFF
function tkProcess(src, w, h, P){
  var n = w * h, i, c, x, y, p4;
  var L = Math.max(w, h);
  var img = new Float32Array(n * 3);
  for (i = 0; i < n; i++){
    img[i * 3] = src[i * 4] / 255; img[i * 3 + 1] = src[i * 4 + 1] / 255; img[i * 3 + 2] = src[i * 4 + 2] / 255;
  }

  // 0) 基本補正（露光量・ハイライト・ホワイトバランス・トーンカーブ・カラーミキサーなど）
  tkNoise(img, w, h, P);
  tkBasic(img, w, h, P);
  tkPresence(img, w, h, P);
  tkGrade(img, n, P);

  // 1) 自動明るさ（平均の明るさを目標へ。掛け算でなくガンマ＝白と黒は動かさず中間調だけ動かす→白飛びしない）
  if (P.on.bright){
    var sum = 0;
    for (i = 0; i < n; i++) sum += tkLuma(img[i * 3], img[i * 3 + 1], img[i * 3 + 2]);
    var m = Math.min(0.97, Math.max(0.02, sum / n)), tg = Math.min(0.97, Math.max(0.03, P.target / 100));
    var gm = Math.log(tg) / Math.log(m);
    gm = Math.max(0.72, Math.min(1.4, gm));
    if (Math.abs(gm - 1) > 0.004){
      var LUT = new Float32Array(4097);
      for (var q = 0; q <= 4096; q++) LUT[q] = Math.pow(q / 4096, gm);
      for (i = 0; i < n * 3; i++) img[i] = LUT[(img[i] * 4096 + 0.5) | 0];
    }
  }

  // 2) フィルムトーン（黒あげ・白おさえ・コントラスト・彩度）＋スプリットトーン
  if (P.on.tone || P.on.split){
    var lift = P.on.tone ? P.lift / 100 * 0.27 : 0;
    var white = P.on.tone ? 1 - P.roll / 100 * 0.22 : 1;
    var con = P.on.tone ? P.con / 100 : 0;
    var sat = P.on.tone ? 1 + P.sat / 100 : 1;
    var shb = P.on.split ? P.shb / 40 : 0;
    var hiw = P.on.split ? P.hiw / 40 : 0;
    for (i = 0; i < n; i++){
      var r = img[i * 3], g = img[i * 3 + 1], b = img[i * 3 + 2];
      if (P.on.tone){
        var k0 = 1 + con * 1.6;
        r = (r - 0.5) * k0 + 0.5; g = (g - 0.5) * k0 + 0.5; b = (b - 0.5) * k0 + 0.5;
        r = lift + tkClamp01(r) * (white - lift); g = lift + tkClamp01(g) * (white - lift); b = lift + tkClamp01(b) * (white - lift);

               db: tkClampV(cr.mb - cs.mb, 0.12), dr: tkClampV(cr.mr - cs.mr, 0.12), dY: tkClampV(cr.Ym - cs.Ym, 0.15) });

  }
  var cw = [0, 0, 0, 0, 0];
  for (i = 0; i < n; i++){
    var R = img[i * 3], G = img[i * 3 + 1], B = img[i * 3 + 2];
    var Y = 0.299 * R + 0.587 * G + 0.114 * B, Cb = (B - Y) * 0.564, Cr = (R - Y) * 0.713;
    var bw = tkBandW(Y), nb = 0, nr = 0;
    for (k = 0; k < 3; k++){ var t = T[k]; nb += bw[k] * ((Cb - t.ms) * t.kb + t.tb); nr += bw[k] * ((Cr - t.mr) * t.kr + t.tr); }
    var dYp = 0;
    if (part){
      tkCatW(R, G, B, cw);

      for (k = 0; k < K; k++){

// ---------- 肌（毛色）の色ムラをそろえる：YIQで肌の色相の帯だけを平均へ寄せる ----------
function tkSkinW(Y, I, Q){

    I2 = C2 * Math.cos(ang); Q2 = C2 * Math.sin(ang);
    img[i * 3] = tkClamp01(Y2 + 0.956 * I2 + 0.621 * Q2); img[i * 3 + 1] = tkClamp01(Y2 - 0.272 * I2 - 0.647 * Q2); img[i * 3 + 2] = tkClamp01(Y2 - 1.106 * I2 + 1.703 * Q2);

// ---------- 寒暖グラデーション（線形） ----------
function tkLinearGrad(img, w, h, P){
  var qa = tkRegPrep({ ev: P.gAev, temp: (P.gAtemp || 0) * 1.8, tint: (P.gAtint || 0) * 1.5, sat: P.gAsat }), qb = tkRegPrep({ ev: P.gBev, temp: (P.gBtemp || 0) * 1.8, tint: (P.gBtint || 0) * 1.5, sat: P.gBsat });
  if (!qa.any && !qb.any) return;
  var x0 = P.gx0 * w, y0 = P.gy0 * h, dx = P.gx1 * w - x0, dy = P.gy1 * h - y0, d2 = dx * dx + dy * dy;
  if (d2 < 4) return;
  var o = [0, 0, 0], oa = [0, 0, 0];
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++){
    var t = tkSS(((x - x0) * dx + (y - y0) * dy) / d2), i = (y * w + x) * 3;   // 0=始点側 1=終点側
    var r = img[i], g = img[i + 1], b = img[i + 2], R = r, G = g, B = b;
    if (qa.any && t < 1){ tkRegAdj(r, g, b, qa, oa); R += (oa[0] - r) * (1 - t); G += (oa[1] - g) * (1 - t); B += (oa[2] - b) * (1 - t); }
    if (qb.any && t > 0){ tkRegAdj(r, g, b, qb, o); R += (o[0] - r) * t; G += (o[1] - g) * t; B += (o[2] - b) * t; }

// ---------- 光の差し込み ----------
function tkRayColor(warm){ var t = warm / 100; return [1, 1 - 0.18 * t, 1 - 0.5 * t]; }
function tkRays(img, w, h, P){
  var L = Math.max(w, h), sx = P.rx * w, sy = P.ry * h, amt = P.rAmt / 100, col = tkRayColor(P.rWarm || 0);
  if (P.rMode === 'leak'){
    // 光漏れ：端から赤橙〜琥珀のやわらかい光
    var R0 = (0.18 + (P.rWidth || 40) / 100 * 0.6) * L;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++){
      var dx = x - sx, dy = y - sy, d = Math.sqrt(dx * dx + dy * dy) / R0;
      var I = amt * 0.9 * Math.exp(-d * d * 1.6); if (I < 0.003) continue;
      var c0 = [1, 0.42 + 0.35 * Math.min(1, d), 0.2 + 0.25 * Math.min(1, d)], i = (y * w + x) * 3;   // 芯は赤橙、外ほど琥珀
      for (var k = 0; k < 3; k++) img[i + k] = 1 - (1 - img[i + k]) * (1 - tkClamp01(c0[k] * col[k] * I));

  // 窓の光：光源から差し込む斜めの帯。帯の中に窓枠の影（本数）を入れられる
  var a = (P.rAng || 0) * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a), nx = -uy, ny = ux;
  var wid = (0.06 + (P.rWidth || 40) / 100 * 0.5) * L, bars = Math.round(P.rBars || 0);
  for (var y2 = 0; y2 < h; y2++) for (var x2 = 0; x2 < w; x2++){
    var px = x2 - sx, py = y2 - sy, along = (px * ux + py * uy) / L, across = (px * nx + py * ny) / wid;
    if (along < -0.05) continue;
    var fa = tkSS((along + 0.05) / 0.12) * Math.exp(-Math.max(0, along) * 0.9);
    var prof = Math.exp(-across * across * 2.2);
    if (bars > 0) prof *= 1 - 0.75 * Math.pow(Math.max(0, Math.cos(across * Math.PI * (bars + 1) * 0.5)), 6);
    var I2 = amt * fa * prof; if (I2 < 0.003) continue;
    var j = (y2 * w + x2) * 3, Y = 0.2126 * img[j] + 0.7152 * img[j + 1] + 0.0722 * img[j + 2];

    for (var k2 = 0; k2 < 3; k2++){

}
// ---------- オールドレンズ風 ----------
function tkOldLens(img, w, h, P){

  var src = (ca > 0 || soft > 0) ? Float32Array.from(img) : null;
  var B = null;
  if (soft > 0){
    var tmp = new Float32Array(n * 4);
    for (i = 0; i < n; i++){ tmp[i * 4] = src[i * 3]; tmp[i * 4 + 1] = src[i * 3 + 1]; tmp[i * 4 + 2] = src[i * 3 + 2]; tmp[i * 4 + 3] = 1; }
    B = tkRowReader(tkBlur(tmp, w, h, L * 0.0045), w);
  }
  function samp(ch, fx, fy){
    if (fx < 0) fx = 0; if (fy < 0) fy = 0; if (fx > w - 1) fx = w - 1; if (fy > h - 1) fy = h - 1;
    var x0 = fx | 0, y0 = fy | 0, x1 = Math.min(w - 1, x0 + 1), y1 = Math.min(h - 1, y0 + 1), tx = fx - x0, ty = fy - y0;
    var a = src[(y0 * w + x0) * 3 + ch], b = src[(y0 * w + x1) * 3 + ch], c = src[(y1 * w + x0) * 3 + ch], d = src[(y1 * w + x1) * 3 + ch];
    return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty;
  }
  for (y = 0; y < h; y++){
    var br = B ? B(y) : null;
    for (x = 0; x < w; x++){
      i = (y * w + x) * 3;
      var dx = x - cx, dy = y - cy, rr = Math.sqrt(dx * dx + dy * dy) / rmax;
      var r = img[i], g = img[i + 1], b = img[i + 2];
      if (ca > 0){
        var k = ca * rr;    // 周辺ほど赤と青がずれる（倍率色収差）
        r += samp(0, cx + dx * (1 + k), cy + dy * (1 + k)) - src[i];
        b += samp(2, cx + dx * (1 - k), cy + dy * (1 - k)) - src[i + 2];

      if (br){

      if (vig > 0){ var f = 1 - vig * 0.55 * Math.pow(rr, 3.2); r *= f; g *= f; b *= f; }
      img[i] = tkClamp01(r); img[i + 1] = tkClamp01(g); img[i + 2] = tkClamp01(b);

}

      if (CUR.tab === t.key){ if (ap.classList.contains('expanded')) window.tkSheetState('n'); else setCollapsed(!ap.classList.contains('collapsed')); return; }
      setCollapsed(false); showTab(t.key);
    });
    tabbar.appendChild(b);
    if (t.chips && !CUR.chip[t.key]) CUR.chip[t.key] = t.chips[0][0];
  });
  // 仕上げパネル
  var looksPanel = document.createElement('div'); panel.appendChild(looksPanel);
  (function buildLooks(){
    looksPanel.appendChild(pbox);
    var row = document.createElement('div'); row.className = 'row';
    row.innerHTML = '<label>強さ</label><input type="range" min="0" max="100" value="100" id="s-mix"><span class="val num" id="v-mix">100</span>';
    looksPanel.appendChild(row);
    row.querySelector('input').addEventListener('input', function(e){ P.mix = +e.target.value; $('v-mix').textContent = e.target.value; schedule(); });
    var ai = document.createElement('button'); ai.type = 'button'; ai.className = 'rbtn aibtn'; ai.id = 'aiBtn'; ai.textContent = 'AIで主役を立てる';
    ai.addEventListener('click', aiSubject); looksPanel.appendChild(ai);
    var st = document.createElement('div'); st.className = 'rstat'; st.id = 'aiStat'; st.textContent = '主役を明るく、手前と奥を控えめに。写真ごとにAIが見分けます（端末の中で処理）。'; looksPanel.appendChild(st);
    var lr = document.createElement('div'); lr.className = 'lookrow';
    var sv = document.createElement('button'); sv.type = 'button'; sv.className = 'rbtn ghost'; sv.textContent = '今の設定を保存';
    sv.addEventListener('click', function(){ showTab('util', 'mypre'); setTimeout(function(){ var i = $('mpName'); if (i) i.focus(); }, 50); });
    lr.appendChild(sv); lr.appendChild($('reset')); looksPanel.appendChild(lr);
  })();
  function setCollapsed(on){ document.getElementById('app').classList.toggle('collapsed', !!on); setTimeout(function(){ if (typeof drawOverlay === 'function') drawOverlay(); }, 240); }
  // パネル上端のバー：3段階（隠す・ふつう・全画面）を指でなぞって行き来。軽く触れたら切り替え
  (function(){
    var grab = document.getElementById('grab'), sheet = document.getElementById('sheet'), appEl = document.getElementById('app'), wrap = document.querySelector('.stagewrap');
    var y0 = null, startH = 0, moved = 0, H = { c: 30, n: 0, f: 0 }, lastVis = 0;
    function state(){ return appEl.classList.contains('expanded') ? 'f' : appEl.classList.contains('collapsed') ? 'c' : 'n'; }
    function setState(st){
      var was = appEl.classList.contains('expanded');
      appEl.classList.toggle('collapsed', st === 'c'); appEl.classList.toggle('expanded', st === 'f');
      if (was !== (st === 'f')) showTab(CUR.tab, CUR.chip[CUR.tab]);
      setTimeout(function(){ if (typeof drawOverlay === 'function') drawOverlay(); }, 240);
    }
    window.tkSheetState = setState;
    grab.addEventListener('pointerdown', function(e){
      var st = state();
      // 各状態の高さを測る（ふつう＝CSSの高さ、全画面＝写真の枠の高さ）
      sheet.classList.add('dragging'); sheet.style.height = ''; appEl.classList.remove('collapsed', 'expanded'); H.n = sheet.offsetHeight; H.f = wrap.offsetHeight;
      appEl.classList.toggle('collapsed', st === 'c'); appEl.classList.toggle('expanded', st === 'f');
      startH = st === 'c' ? H.c : st === 'f' ? H.f : H.n;
      y0 = e.clientY; moved = 0; lastVis = startH; try{ grab.setPointerCapture(e.pointerId); }catch(x){}
      sheet.classList.add('dragging'); sheet.style.transform = 'none'; sheet.style.height = startH + 'px';
    });
    grab.addEventListener('pointermove', function(e){
      if (y0 == null) return; var dy = e.clientY - y0; moved = Math.max(moved, Math.abs(dy));
      lastVis = Math.min(H.f, Math.max(H.c, startH - dy)); sheet.style.height = lastVis + 'px';
    });
    function end(e){
      if (y0 == null) return; var dy = e.clientY - y0, st = state(); y0 = null;
      sheet.classList.remove('dragging'); sheet.style.transform = ''; sheet.style.height = '';
      if (moved < 8){ setState(st === 'f' ? 'n' : st === 'c' ? 'n' : 'c'); return; }
      // なぞった向きの次の段へ（40px以上動かしたら）。大きくなぞった時は、その向きで離した位置に近い段まで進む
      if (Math.abs(dy) < 40){ setState(st); return; }
      var cand = [['c', H.c], ['n', H.n], ['f', H.f]].filter(function(c){ return dy < 0 ? c[1] > startH + 1 : c[1] < startH - 1; });
      if (!cand.length){ setState(st); return; }
      var best = cand[0], bd = 1e9;
      cand.forEach(function(c){ var d = Math.abs(lastVis - c[1]); if (d < bd){ bd = d; best = c; } });
      setState(best[0]);
    }
    grab.addEventListener('pointerup', end); grab.addEventListener('pointercancel', end);
  })();
  // 写真をタップ：操作部分をすべて隠す／もう一度タップで、直前のパネルのまま戻す
  (function(){
    var appEl = document.getElementById('app'), st = $('stage'), d = null, told = false;
    function editing(){ return !!PICK || REG.tool !== 'off' || REG.pickDodge || CROPMODE; }
    st.addEventListener('pointerdown', function(e){ if (!img || editing()) { d = null; return; } d = { x: e.clientX, y: e.clientY, t: Date.now() }; });
    st.addEventListener('pointerup', function(e){
      if (!d || editing()) return;
      var far = Math.hypot(e.clientX - d.x, e.clientY - d.y), dt = Date.now() - d.t; d = null;
      if (far > 10 || dt > 400) return;
      var on = !appEl.classList.contains('immersive');
      appEl.classList.toggle('immersive', on);
      if (on && !told){ told = true; setTimeout(function(){ toast('写真をもう一度タップすると戻ります'); }, 50); }
      setTimeout(function(){ if (typeof drawOverlay === 'function') drawOverlay(); }, 240);
    });
  })();
  function showTab(key, chip){
    CUR.tab = key; if (chip) CUR.chip[key] = chip;
    // いま表示しているグループを置き場へ戻す
    Array.prototype.slice.call(panel.children).forEach(function(ch){ if (ch.classList.contains('group')) pool.appendChild(ch); });
    subtabs.innerHTML = '';
    var t = TABS.filter(function(x){ return x.key === key; })[0];
    looksPanel.hidden = !!t.chips;        // 仕上げパネルは常に置いたまま（中の部品をいつでも参照できるように）
    if (t.chips){
      if (t.chips.length > 1) t.chips.forEach(function(c){
        var b = document.createElement('button'); b.type = 'button'; b.className = 'stab' + (c[0] === CUR.chip[key] ? ' on' : ''); b.dataset.c = c[0];
        b.innerHTML = '<i></i>' + c[1]; b.addEventListener('click', function(){
          if (document.getElementById('app').classList.contains('expanded')){
            CUR.chip[key] = c[0];
            Array.prototype.forEach.call(subtabs.children, function(x){ x.classList.toggle('on', x.dataset.c === c[0]); });
            var g0 = panel.querySelector('.group[data-chip="' + c[0] + '"]'); if (g0) panel.scrollTo({ top: panel.scrollTop + g0.getBoundingClientRect().top - panel.getBoundingClientRect().top - 2, behavior: 'smooth' });
            return;
          }
          showTab(key, c[0]);
        });
        subtabs.appendChild(b);
      });
      var cur = t.chips.filter(function(c){ return c[0] === CUR.chip[key]; })[0] || t.chips[0];
      // 全画面の時は、そのタブの項目をすべて縦に並べる（上の切り替えは、その項目へ飛ぶボタンになる）
      var full = document.getElementById('app').classList.contains('expanded');
      (full ? t.chips : [cur]).forEach(function(c){ c[2].forEach(function(gk){ var g = $('g-' + gk); if (g){ g.classList.add('open'); g.dataset.chip = c[0]; panel.appendChild(g); } }); });
      if (full && chip) setTimeout(function(){ var g0 = panel.querySelector('.group[data-chip="' + chip + '"]'); if (g0) panel.scrollTop = panel.scrollTop + g0.getBoundingClientRect().top - panel.getBoundingClientRect().top - 2; }, 0);
      var sel = subtabs.querySelector('.stab.on'); if (sel && sel.scrollIntoView) sel.scrollIntoView({ inline: 'nearest', block: 'nearest' });
    }
    if (!(document.getElementById('app').classList.contains('expanded') && chip)) panel.scrollTop = 0;
    Array.prototype.forEach.call(tabbar.children, function(b){ b.classList.toggle('on', b.dataset.t === key); });
    setTimeout(function(){ try{ drawCurve(); }catch(e){} try{ syncGrade(); }catch(e){} }, 0);
    if (t.chips){ var cc = CUR.chip[key] || t.chips[0][0]; setCropMode(key === 'adj' && cc === 'geo' && !document.getElementById('app').classList.contains('expanded')); } else setCropMode(false);
    updateIndicators();
    if (typeof drawOverlay === 'function') drawOverlay();
  }
  // ONになっている機能に印を付ける（どこを触ったか一目で分かるように）
  function groupOn(k){
    if (k === 'reg') return !!(P.on.reg && REG.ready);
    // 基本補正は「ON」かつ「どれかを動かした」ときだけ印を付ける
    if (k === 'basic') return !!P.on.basic && TK_LIGHT_KEYS.some(function(q){ return P[q]; });
    if (k === 'wb') return !!P.on.wb && TK_WB_KEYS.some(function(q){ return P[q]; });
    if (k === 'mix') return tkMixActive(P);
    if (k === 'crv') return tkCurveActive(P);
    if (k === 'cg') return tkGradeActive(P);
    if (k === 'fx') return !!P.on.fx && !!(P.fxTex || P.fxCla || P.fxDeh || P.vgAmt);
    if (k === 'det') return !!P.on.det && !!(P.shAmt || P.nrL || P.nrC);
    if (k === 'geo') return geoOn();
    return !!P.on[k];
  }
  function updateIndicators(){
    TABS.forEach(function(t){
      var any = false;
      if (t.chips) t.chips.forEach(function(c){
        var on = c[2].some(groupOn) && !(t.key === 'util'); any = any || on;
        var b = subtabs.querySelector('.stab[data-c="' + c[0] + '"]'); if (b && CUR.tab === t.key) b.classList.toggle('act', on);
      });
      else any = P.mix < 100;
      var tb = tabbar.querySelector('.tab[data-t="' + t.key + '"]'); if (tb) tb.classList.toggle('act', any);
    });
  }
  // AIで主役を立てる（部分調整の切り分け＋おまかせを1回で）
  function aiSubject(){
    if (!img){ toast('先に写真を選んでください'); return; }
    var btn = $('aiBtn'), st = $('aiStat'); btn.disabled = true;
    P.on.reg = 1; syncGroup('reg');
    var mirror = setInterval(function(){ if (regEls.stat) st.textContent = regEls.stat.textContent; }, 300);
    (REG.ready ? Promise.resolve() : runSegmentation()).then(function(){
      clearInterval(mirror); btn.disabled = false;
      if (REG.ready){ regOmakase(); st.textContent = '主役を立てました。ずれや強さは「部分」で直せます。'; }
      else st.textContent = regEls.stat ? regEls.stat.textContent : '切り分けできませんでした。';
      updateIndicators();
    });
  }
  // ---- 見本を作る（自分の写真に各プリセットを当てた小さな画像） ----
  var thumbGen = 0;
  function presetParams(key){
    var q = JSON.parse(JSON.stringify(P)); q.mix = 100; q.on.reg = 0;
    if (key.indexOf('my:') === 0){
      var o = mpLoad()[key.slice(3)]; if (!o) return null;
      q = JSON.parse(JSON.stringify(o.P)); q.on = q.on || {}; q.on.reg = 0; q.mix = q.mix == null ? 100 : q.mix; return q;
    }
    var p = TK_PRESETS[key] || {};
    Object.keys(DEFAULTS).forEach(function(k){ q[k] = (key !== 'none' && k in p) ? p[k] : DEFAULTS[k]; });
    if (p.rMode) q.rMode = p.rMode;
    Object.keys(q.on).forEach(function(k){ if (KEEP_ON[k]) return; q.on[k] = (key !== 'none' && p.on && (k in p.on)) ? (p.on[k] ? 1 : 0) : (OFF_KEYS[k] ? 0 : 1); });
    q.on.reg = 0; return q;
  }
  function renderLookThumbs(){
    if (!img) return;
    var my = ++thumbGen, sz = sizeFor(200), src = readPixels(sz[0], sz[1]);
    var tiles = Array.prototype.slice.call(pbox.children);
    (function next(i){
      if (my !== thumbGen || i >= tiles.length) return;
      var t = tiles[i], q = presetParams(t.dataset.p);
      if (q){
        try{
          var out = tkProcess(src, sz[0], sz[1], q), c = document.createElement('canvas'); c.width = sz[0]; c.height = sz[1];
          c.getContext('2d').putImageData(new ImageData(out, sz[0], sz[1]), 0, 0);
          var cv = t.querySelector('canvas'), x = cv.getContext('2d'); x.clearRect(0, 0, cv.width, cv.height);
          var s = Math.max(cv.width / sz[0], cv.height / sz[1]); x.drawImage(c, (cv.width - sz[0] * s) / 2, (cv.height - sz[1] * s) / 2, sz[0] * s, sz[1] * s);
        }catch(e){}
      }
      setTimeout(function(){ next(i + 1); }, 0);
    })(0);
  }
  // ---- 取り消し／やり直し ----
  var HIST = [], REDO = [], restoring = false, histTimer = null;
  function snapState(){ var q = JSON.parse(JSON.stringify(P)); delete q.reg.ver; return JSON.stringify(q); }
  function applyState(str){
    restoring = true;
    var d = JSON.parse(str), ver = P.reg.ver;
    Object.keys(d).forEach(function(k){ P[k] = d[k]; });
    P.reg.ver = ver;
    GROUPS.forEach(function(g){ (g.sliders || []).forEach(function(s){ if (P[s[0]] != null) setVal(s[0], P[s[0]]); }); });
    Object.keys(P.on).forEach(function(k){ syncGroup(k); });
    $('s-mix').value = P.mix; $('v-mix').textContent = P.mix;
    setMode(P.dmode || 'B'); updateRegUI(); updateExtras(); markPreset('__none__');
    schedule(); restoring = false; updateHistBtns();
  }
  function updateHistBtns(){ $('undo').disabled = HIST.length < 2; $('redo').disabled = !REDO.length; }
  function noteChange(){
    if (restoring) return;
    clearTimeout(histTimer);
    histTimer = setTimeout(function(){
      var s = snapState(); if (HIST.length && HIST[HIST.length - 1] === s) return;
      HIST.push(s); if (HIST.length > 60) HIST.shift(); REDO = []; updateHistBtns();
    }, 450);
  }
  $('undo').addEventListener('click', function(){ if (HIST.length < 2) return; REDO.push(HIST.pop()); applyState(HIST[HIST.length - 1]); toast('取り消しました'); });
  $('redo').addEventListener('click', function(){ if (!REDO.length) return; var s = REDO.pop(); HIST.push(s); applyState(s); toast('やり直しました'); });
  HIST.push(snapState());
  // 変更のたびに：印の更新と履歴
  var _sched0 = schedule;
  schedule = function(){ _sched0(); updateIndicators(); noteChange(); };
  // 自分の設定が増減したら見本の列も作り直す
  var _ux0 = updateExtras;
  updateExtras = function(){ _ux0(); var n = Object.keys(mpLoad()).length; if (n !== buildLookTiles._n){ buildLookTiles._n = n; buildLookTiles(); renderLookThumbs(); } };
  try{ if (window.matchMedia('(pointer:fine)').matches) $('dropBig').textContent = 'クリックして選択、またはここへドラッグ'; }catch(e){}
  showTab('look');

  var tt = null;
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('show'); }, 2200); }
})();
</script>
<script>
// 更新を確実に反映：保存の仕組み（sw.js）は毎回サーバーに確認し、新しい版に切り替わったら1度だけ読み直す
if ("serviceWorker" in navigator && location.protocol === "https:"){
  var hadSW = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function(r){
    r.update();
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") r.update(); });
  }).catch(function(){});
  navigator.serviceWorker.addEventListener("controllerchange", function(){ if (hadSW && !reloaded && !window.TK_BUSY_IMG){ reloaded = true; location.reload(); } });
}
</script>
